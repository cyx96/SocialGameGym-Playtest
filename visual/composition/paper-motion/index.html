<!doctype html>
<html lang="zh-CN"><head><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/i18n-definition.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/i18n-core.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/i18n.js"></script><link rel="stylesheet" href="/SocialGameGym-Playtest/visual/q146-product-language/shared/language-menu.css"><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/language-menu.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸面反馈 · SocialGameGym</title>
<link rel="stylesheet" href="../../q146-product-language/shared/button.css"><link rel="stylesheet" href="../../q146-product-language/shared/controls.css"><link rel="stylesheet" href="../../q146-product-language/shared/journey.css"><link rel="stylesheet" href="../../q146-product-language/shared/paper-controls.css">
<style>body{margin:0;background:var(--canvas);color:var(--label);font:var(--sg-type-body)/1.6 var(--sg-font-ui)}main{max-width:960px;margin:auto;padding:40px 28px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:56px}h1{font-size:var(--sg-type-title);margin:0}h2{font-size:var(--sg-type-body);font-weight:600;margin:0 0 24px}section{margin-block:48px}.specimens{display:flex;gap:28px;align-items:center;flex-wrap:wrap}.fields{display:grid;grid-template-columns:1fr 1fr;gap:32px}.field{display:block}.field>span:first-child{display:block;margin-bottom:12px}.sg-input{width:100%;font:inherit}.sg-choice{display:flex;gap:12px}.option{min-width:100px}.sg-reading[open]{display:flex;flex-direction:column}.sg-reading-head{display:flex;align-items:center;justify-content:space-between;padding:24px}.sg-reading-head h2{margin:0}.sg-reading-body{padding:0 24px 32px;overflow:auto}.sg-reading-actions{padding:0 24px 24px;display:flex;justify-content:flex-end;gap:12px}select{font:inherit;color:var(--ink);border:0;background:transparent;padding:8px}.sg-paper-copy{position:relative;z-index:3}@media(max-width:600px){main{padding:28px 20px 64px}.fields{grid-template-columns:1fr}header{margin-bottom:36px;align-items:flex-start;padding-inline-end:76px}h1{font-size:var(--sg-type-app-navigation)}}
.specimens>fieldset{inline-size:240px;min-inline-size:0}.specimens>fieldset .sg-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field textarea{resize:none}#follow{min-inline-size:6rem}</style><script src="../../q146-product-language/shared/motion.js"></script><script src="../../q146-product-language/shared/themes.js"></script><script src="../../q146-product-language/shared/icons.js"></script></head>
<body><main><header><h1>纸面反馈</h1><select id="theme" aria-label="主题色"><option value="coordination">协调</option><option value="information">信息</option><option value="creation">共创</option><option value="cooperation">合作</option><option value="trust" selected>信任</option><option value="allocation">分配</option><option value="market">市场</option><option value="protection">保障</option><option value="incentives">激励</option><option value="governance">治理</option><option value="competition">竞争</option><option value="matching">匹配</option></select></header>
<section><h2>操作</h2><div class="specimens"><button id="submit" class="sg-button" data-sg-button data-sg-role="primary"><span class="sg-paper-copy">提交</span></button><button class="sg-button" data-sg-button data-sg-role="soft"><span class="sg-paper-copy">返回桌面</span></button><button class="sg-button" data-sg-button data-sg-role="danger"><span class="sg-paper-copy">删除</span></button><button id="send" class="sg-button" data-sg-button data-sg-role="icon-primary" aria-label="发送"><span class="sg-paper-copy" data-icon="send"></span></button><button class="sg-button" data-sg-button data-sg-role="primary" disabled><span class="sg-paper-copy">提交</span></button></div></section>
<section><h2>选择</h2><div class="specimens"><fieldset class="sg-field" aria-label="是否合作"><div class="sg-choice short-options"><label class="option"><input type="radio" name="choice" checked><span class="option-label"><span class="sg-paper-copy">是</span></span></label><label class="option"><input type="radio" name="choice"><span class="option-label"><span class="sg-paper-copy">否</span></span></label></div></fieldset><button id="follow" class="sg-button" data-sg-button data-sg-role="soft" aria-pressed="false"><span class="sg-paper-copy">关注</span></button></div></section>
<section><h2>编辑</h2><div class="fields"><label class="field sg-field"><span>显示名</span><span data-sg-paper-field><input class="sg-input" id="name" value="林舟" autocomplete="off"></span></label><label class="field sg-field"><span>简介</span><span data-sg-paper-field><textarea class="sg-input" rows="3">比起承诺，我更在意我们怎样一起做出选择。</textarea></span></label></div></section>
<section><h2>请求与阅读</h2><div class="specimens"><select id="request" aria-label="请求状态"><option value="idle">可提交</option><option value="busy">处理中</option></select><button id="reader-trigger" class="sg-button" data-sg-button data-sg-role="soft"><span class="sg-paper-copy">游戏规则</span></button></div></section>
<dialog class="sg-reading" id="reader" aria-label="游戏规则"><header class="sg-reading-head"><h2>游戏规则</h2><button class="sg-button" data-sg-button data-sg-role="icon" data-close aria-label="关闭"><span class="sg-paper-copy" data-icon="close"></span></button></header><div class="sg-reading-body"><h2>玩法简介</h2><p>你与当前伙伴分别选择 A 或 B，双方的选择共同决定收益。</p><h2>如何进行</h2><p>在游戏中选择并提交；本步仍可修改。回桌面进入下一步时，最后一次提交才正式生效。</p><h2>如何计分</h2><p>每次互动分别计分，最终查看自己的累计结果。</p></div><footer class="sg-reading-actions"><button class="sg-button" data-sg-button data-sg-role="soft" data-close><span class="sg-paper-copy">关闭</span></button></footer></dialog>
<script src="../../q146-product-language/shared/button.js"></script><script src="../../q146-product-language/shared/controls.js"></script><script src="../../q146-product-language/shared/reading-surface.js"></script><script src="../../q146-product-language/shared/paper-controls.js"></script>
<script>
SGGThemes.apply('trust');document.querySelectorAll('[data-icon]').forEach(n=>n.append(SGGIcons.create(n.dataset.icon)));
document.querySelector('#theme').onchange=e=>{SGGPaper.settle();SGGThemes.apply(e.target.value)};
document.querySelector('#follow').onclick=e=>{const n=e.currentTarget,on=n.getAttribute('aria-pressed')!=='true';n.setAttribute('aria-pressed',String(on));n.querySelector('.sg-paper-copy').textContent=on?'已关注':'关注'};
document.querySelector('#request').onchange=e=>{for(const id of ['submit','send'])SGGButtons.busy(document.getElementById(id),e.target.value==='busy')};
document.querySelector('#reader-trigger').onclick=e=>SGGReading.open(document.querySelector('#reader'),{event:e});
document.querySelectorAll('[data-close]').forEach(n=>n.onclick=()=>SGGReading.close(document.querySelector('#reader')));
</script></main></body></html>
