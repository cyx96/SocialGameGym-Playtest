*{box-sizing:border-box}body{margin:0;color:var(--label);background:var(--canvas);font:var(--sg-type-body)/var(--sg-leading-body) var(--sg-font-ui)}main{max-width:1120px;margin:auto;padding:40px 32px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}h1{margin:0;font:600 var(--sg-type-app-navigation)/1.4 var(--sg-font-ui)}h2{font-size:var(--sg-type-title);margin:0 0 24px}section{margin-top:56px}.row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}#apps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.launch-tool{display:grid;justify-items:center;gap:12px;background:transparent;color:var(--label);font:inherit;border:0;padding:8px;min-width:0;cursor:pointer}#avatars,#icons{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:24px 16px}.glyph,.avatar-sample{display:grid;justify-items:center;gap:12px;min-width:0}.glyph span,.avatar-sample span{font-size:var(--sg-type-meta);overflow-wrap:anywhere}.glyph svg{width:24px;height:24px}.profile-sample{display:flex;align-items:center;gap:12px}.body-sample{max-width:64ch;line-height:1.8}.demo-menu{border:0;background:var(--surface);color:var(--label);padding:16px;border-radius:var(--sg-radius-surface);box-shadow:var(--sg-shadow-popover)}.sg-reading[open]{display:flex;flex-direction:column}.sg-reading-head{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px}.sg-reading-head h2{margin:0}.sg-reading-body{padding:0 24px 32px;overflow:auto}.sg-reading-actions{padding:0 24px 24px;display:flex;justify-content:flex-end}.sg-select{min-width:0}@media(max-width:700px){main{padding:24px 20px 56px}.fields{grid-template-columns:1fr}#apps{grid-template-columns:repeat(3,minmax(0,1fr))}section{margin-top:40px}.row{gap:16px}}
</style></head><body><main><header><h1>纸艺系统</h1><select id="theme" aria-label="主题色"></select></header>
<section><h2>六个 App</h2><div id="apps"></div></section>
<section><h2>按钮与输入</h2><div class="row" id="buttons"></div><div class="fields" id="fields" style="margin-top:32px"></div></section>
<section><h2>头像</h2><div id="avatars"></div></section>
<section><h2>操作与状态符号</h2><div id="icons"></div></section>
<section><h2>阅读与数据</h2><p class="body-sample">同一种纸材、同一左上柔光。纸面保持稳定，折面与纸影表达接触和层高。@林舟 与 @Alex，轮次 2/5，游戏第 1/2 步。桌面、问卷、图书、圈层与数据保持清晰。</p><div class="row" id="reading-actions"></div></section>
<dialog class="sg-reading" id="reader" aria-label="游戏规则"><header class="sg-reading-head"><h2>游戏规则</h2><button class="sg-button" data-sg-button data-sg-role="icon" id="close" aria-label="关闭"></button></header><div class="sg-reading-body"><h2>玩法简介</h2><p>你与当前伙伴分别作出选择，双方的选择共同决定结果。</p><h2>如何进行</h2><p>在游戏中完成选择并提交；回到桌面进入下一步。</p><h2>如何计分</h2><div class="sg-rule-table" role="region" aria-label="收益标本" tabindex="0"><table><thead><tr><th>来源</th><th>支持答案</th><th>权重</th></tr></thead><tbody><tr><td>共享线索</td><td>A</td><td>2</td></tr><tr><td>你的原线索</td><td>B</td><td>2</td></tr></tbody></table></div></div></dialog>
<script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/i18n-definition.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/i18n-core.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/i18n.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/motion.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/icons.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/themes.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/avatar-registry.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/avatar.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/button.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/controls.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/reading-surface.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/app-launcher.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/app-object-motion.js"></script><script src="/SocialGameGym-Playtest/visual/q146-product-language/shared/paper-controls.js"></script><script>
SGGThemes.apply('trust');const q=s=>document.querySelector(s);for(const id of SGGThemes.ids){const o=document.createElement('option');o.value=id;o.textContent=id;q('#theme').append(o)}q('#theme').value='trust';q('#theme').onchange=e=>{SGGPaper.settle();SGGAppObjects.settle();SGGThemes.apply(e.target.value)};
for(const [id,label] of [['profile','资料'],['forum','论坛'],['dm','私信'],['rating','评分'],['game','游戏'],['questionnaire','问卷']]){const b=SGGAppLauncher.create({id,label});b.dataset.app=id;q('#apps').append(b)}
for(const o of [{label:'提交',role:'primary'},{label:'返回桌面',role:'soft'},{label:'删除',role:'danger'},{label:'提交',role:'primary',disabled:true}])q('#buttons').append(SGGButtons.create(o));const busy=SGGButtons.create({label:'提交',role:'primary'});q('#buttons').append(busy);SGGButtons.busy(busy,true);
q('#fields').append(SGGControls.number({key:'rounds',label:'轮数',min:1,max:20},3,()=>{}),SGGControls.select({key:'mode',label:'参与方式',options:[{value:'human',label:'真人'},{value:'ai',label:'AI'}]},'human',()=>{}),SGGControls.text({key:'name',label:'显示名'},'林舟',()=>{}));SGGControls.enhance(q('#fields'));
for(const [id,e] of Object.entries(SGGAvatar.registry)){const n=document.createElement('div');n.className='avatar-sample';n.append(SGGAvatar.node({preset:id,size:'row'}));const name=document.createElement('span');name.textContent=e.label;n.append(name);q('#avatars').append(n)}
for(const id of SGGIcons.names){const n=document.createElement('div');n.className='glyph';n.append(SGGIcons.create(id));const name=document.createElement('span');name.textContent=id;n.append(name);q('#icons').append(n)}
const open=SGGButtons.create({label:'游戏规则',role:'soft'});open.onclick=e=>SGGReading.open(q('#reader'),{event:e});q('#reading-actions').append(open);q('#close').append(SGGIcons.create('close'));q('#close').onclick=()=>SGGReading.close(q('#reader'));SGGPaper.enhance();
</script></main></body></html>
