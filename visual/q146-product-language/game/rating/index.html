			return reduced.matches;
		},

	background: var(--wash);

/* Inline identity candidates: text keeps its natural line box, artwork follows its optical baseline. */
.sg-person-mention.sg-person-inline {
	display: inline;
	line-height: inherit;
	overflow-wrap: anywhere;
}
.sg-person-inline .sg-avatar {
	--avatar-size: var(--sg-inline-avatar-size);
	display: inline-grid;
	inline-size: var(--avatar-size);
	block-size: var(--avatar-size);
	font-size: inherit;
	margin-inline: var(--sg-person-inline-gap);
	vertical-align: var(--sg-inline-avatar-baseline);
}
.sg-person-inline .sg-person-visible-name,

	font: inherit;
	line-height: inherit;
	overflow-wrap: anywhere;
}

	font-weight: 400;
}

	display: inline;
	background: none;
	border: 0;
	border-radius: 2px;
	padding: 0;
	margin: 0;
	font: inherit;
	line-height: inherit;
	color: var(--ink);
	text-align: inherit;
	vertical-align: baseline;
	white-space: inherit;
	cursor: pointer;
	touch-action: manipulation;
	-webkit-tap-highlight-color: transparent;

	outline: 2px solid var(--ink);
	outline-offset: 2px;

		text-decoration: underline;

}

				const text = element("span", "sg-person-text");

			} else if (order === "avatar-at-name") {
				const text = element("span", "sg-person-text");
				text.append(at, name);
				n.append(image, text);
			} else {
				n.append(at, image, name);

		return label(id, identities, { ...options, mention: true });
	}

		root,
		parts,
		{ identities, viewerId, avatar = settings.avatars, order = settings.order } = {},
	) {
		root.replaceChildren();

	}
	function text(id, identities, options) {
		return label(id, identities, options).textContent;
	}

		"click",
		(event) => {
			const link =

					target: detail.personId,
					keyboard: detail.keyboard,

		render,

				settings.order = options.order;
		},
	});
})();

(() => {
	"use strict";
	const positive = (n) => Number.isSafeInteger(Number(n)) && Number(n) > 0;
	const apps = Object.freeze({
		profile: "资料",
		forum: "论坛",
		dm: "私信",
		rating: "评分",
		game: "游戏",
		questionnaire: "问卷",
	});
	function quota(count) {
		return Number.isSafeInteger(count) && count >= 0 ? "本步剩余 " + count + " 次" : "次数暂不可用";
	}
	function stamp({ round, step, steps } = {}) {
		const parts = [];
		if (positive(round)) parts.push("第 " + round + " 轮");
		if (positive(step))
			parts.push(
				positive(steps) && Number(step) <= Number(steps)
					? "社交 " + step + "/" + steps + " 步"
					: "社交第 " + step + " 步",
			);
		return parts.join(" · ");
	}
	function identities(context) {
		return Object.fromEntries(
			(context?.people || []).map((p) => [
				p.id,
				{ name: p.name, avatar: context.profiles?.[p.id]?.avatar || "default" },
			]),
		);
	}
	window.SGGProductLanguage = Object.freeze({ apps, quota, stamp, identities });
})();

window.createInlineFeedbackEditor = ({

	surface,
	inner,
	launch,
	instant,
	changed,
	closed,
}) => {
	let phase = "closed",
		token = 0,
		timer = 0,
		cleanup = () => {},
		dead = false;
	function finishMotion(open, stamp) {
		if (dead || stamp !== token) return;
		clearTimeout(timer);
		cleanup();
		phase = open ? "open" : "closed";
		slot.dataset.editorState = phase;
		if (open) {
			surface.style.height = inner.scrollHeight + "px";
			slot.style.height = inner.scrollHeight + "px";
		} else {
			surface.hidden = true;
			surface.inert = true;
			launch.hidden = false;
			inner.replaceChildren();
			slot.style.height = launch.getBoundingClientRect().height + "px";
			closed?.();
		}
		changed?.(phase);
	}
	function set(open, { immediate = false } = {}) {
		if (dead) return;
		cleanup();
		clearTimeout(timer);
		const stamp = ++token,
			noMotion = immediate || instant();
		const current = slot.getBoundingClientRect().height;
		slot.style.height = current + "px";
		surface.style.height = current + "px";
		surface.hidden = false;
		surface.inert = !open;
		launch.hidden = true;
		slot.classList.toggle("instant", noMotion);
		slot.offsetHeight;
		phase = open ? "opening" : "closing";
		slot.dataset.editorState = phase;
		changed?.(phase);
		const target = open ? inner.scrollHeight : 64;
		surface.style.height = target + "px";
		slot.style.height = target + "px";
		const end = (e) => {
			if (e.target === slot && e.propertyName === "height") finishMotion(open, stamp);
		};
		slot.addEventListener("transitionend", end);
		cleanup = () => slot.removeEventListener("transitionend", end);
		if (noMotion || Math.abs(current - target) < 0.5) finishMotion(open, stamp);
		else
			timer = setTimeout(
				() => finishMotion(open, stamp),
				SGGMotion.options(open ? "expand" : "collapse").duration + 80,
			);
	}

		if (!dead && phase === "open") {
			slot.classList.add("instant");
			surface.style.height = inner.scrollHeight + "px";
			slot.style.height = inner.scrollHeight + "px";
		}
	});

	slot.dataset.editorState = "closed";
	surface.hidden = true;
	surface.inert = true;
	return {
		set,
		complete: () => {
			if (phase === "opening" || phase === "closing") set(phase === "opening", { immediate: true });
		},
		destroy: () => {
			dead = true;
			++token;
			clearTimeout(timer);
			cleanup();
			observer.disconnect();
		},
		get phase() {
			return phase;
		},
	};

		for (const input of document.querySelectorAll(

			select.classList.add("sg-select-control");
		for (const [selector, role] of rules)
			for (const b of document.querySelectorAll(selector)) {
				if (b.tagName !== "BUTTON") continue;
				b.dataset.sgButton = "";
				b.dataset.sgRole = role;
				if (
					b.matches(
						".submit-newpost,.send-reply,.create-submit,.dialog-head .ready-button,.app-toolbar .save,.sheet-toolbar .save,.editor-footer .primary",
					)
				)
					b.dataset.sgSize = "compact";

					b.innerHTML =
						'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';
			}
		for (const group of document.querySelectorAll(".filters")) group.dataset.sgSegmented = "";
		for (const c of document.querySelectorAll(".choice-options")) c.classList.add("sg-choice");

			['.sheet-toolbar [aria-label="关闭玩家资料"]', "close"],

			["[data-action=menu]", "player-type"],
			["#config[data-mode=add] #config-submit", "check"],
			["#config[data-mode=edit] #config-submit", "check"],
			[".reply-root", "reply"],
			[".edit-members", "chevron-down"],
			[".send-message", "send"],
			[
				".reading button[data-support=rules],.reading button[data-panel=rules],.reading button[data-journey-reading=rules],.site nav [data-panel=rules]",
				"rules",
			],
			[
				".reading button[data-support=records],.reading button[data-panel=records],.reading button[data-journey-reading=records],.site nav [data-panel=records]",
				"records",
			],
			['button[data-step$=":-1"],button[data-quota-step="-1"],.stepper:first-child', "minus"],
			['button[data-step$=":1"],button[data-quota-step="1"],.stepper:last-child', "plus"],
		];
		// Old social headers have no binding attributes; these two labels are a migration-only lookup.
		for (const b of document.querySelectorAll(".reading button:not([aria-label])")) {
			const label = b.textContent.trim();
			if (label === "规则" || label === "记录")
				b.dataset.sgReading = label === "规则" ? "rules" : "records";
		}
		icons.push(
			[".reading button[data-sg-reading=rules]", "rules"],
			[".reading button[data-sg-reading=records]", "records"],
		);
		const selectedIcons = new Map();
		for (const [selector, name] of icons)
			for (const b of document.querySelectorAll(selector)) selectedIcons.set(b, name);
		for (const [b, name] of selectedIcons) {
			const label =
				name === "rules"
					? "游戏规则"
					: name === "records"
						? "游戏记录"
						: b.matches(".save")
							? "保存资料"
							: b.matches("#config-submit")
								? document.querySelector("#config").dataset.mode === "edit"
									? "保存配置"
									: "添加玩家"
								: b.matches("[data-action=menu]")
									? "选择玩家类型"
									: b.getAttribute("aria-label") || b.textContent.trim();
			if (label) B.iconize(b, { name, label });
		}
		for (const b of document.querySelectorAll("[data-action=copy]")) {
			const copied = b.textContent.trim() === "已复制";
			B.iconize(b, {
				name: copied ? "check" : "copy",
				label: b.textContent.trim() || b.getAttribute("aria-label"),
			});

			b.dataset.sgMotion = "disclosure";
		for (const b of document.querySelectorAll("[data-action=menu]")) b.dataset.sgMotion = "add";
		B.enhance();
	}
	migrate();
	new MutationObserver((records) => {
		if (records.some((r) => r.addedNodes.length)) migrate();
	}).observe(document.body, { childList: true, subtree: true });
})();

	"use strict";
	const state = new WeakMap();
	const e = (tag, cls, text) => {
		const n = document.createElement(tag);
		if (cls) n.className = cls;
		if (text !== undefined) n.textContent = String(text);
		return n;
	};
	function chevron() {
		const n = e("span", "record-chevron");
		n.setAttribute("aria-hidden", "true");
		n.append(SGGIcons.create("chevron-down"));
		return n;
	}
	function facts(rows) {
		const dl = e("dl", "record-facts");
		for (const f of rows) {
			const row = e("div", "record-fact");
			const value = e("dd", "");
			if (f.numeric)
				value.append(NumberUI.element(f.numeric, { unit: f.unit || "", signed: !!f.signed }));
			else if (f.quantities) {
				value.classList.add("number-pair");
				f.quantities.forEach((q, i) => {
					if (i) value.append(e("span", "number-pair-separator", "/"));
					value.append(NumberUI.element(q.value, { unit: q.unit || "", signed: !!q.signed }));
				});
			} else value.textContent = f.value;
			row.append(e("dt", "", f.label), value);
			dl.append(row);
		}
		return dl;
	}
	function render({ view, identities, viewerId }) {
		const root = e("div", "game-record-list");
		root.setAttribute("aria-label", "游戏记录");
		if (!view) {
			root.append(e("p", "record-empty", "游戏记录暂时无法读取。"));
			return root;
		}
		if (!view.groups.length) {
			root.append(e("p", "record-empty", "还没有游戏记录。"));
			return root;
		}
		const memory = state.get(view) || {
			open: new Set([view.groups[0].id]),
			snapshots: new Set(),
			scroll: 0,
		};
		state.set(view, memory);
		root.addEventListener("scroll", () => (memory.scroll = root.scrollTop), { passive: true });
		if (view.groups.length > 8) {
			const label = e("label", "record-jump", "查看轮次"),
				select = e("select");
			select.setAttribute("aria-label", "查看轮次");
			for (const g of view.groups) {
				const option = e("option", "", g.title);
				option.value = g.id;
				select.append(option);
			}
			select.addEventListener("change", () => {
				const target = root.querySelector('[data-round="' + CSS.escape(select.value) + '"]');
				target.open = true;
				target.scrollIntoView({ block: "start", behavior: "instant" });
			});
			label.append(select);
			root.append(label);
		}

		const renderers = {
			Interaction(event, copy, row) {
				const image = SGGAvatar.node({
					preset: identities[event.actorId]?.avatar || "default",
					size: "reply",
					person: event.actorId,
				});
				image.classList.add("record-avatar");
				row.prepend(image);
				copy.append(
					SGGInlinePerson.render(
						e("p", "record-event-title"),
						[{ personId: event.actorId }, "向 ", { personId: event.targetId }, event.verb],
						{ identities, viewerId },
					),
				);
				const amount = e("p", "record-event-amount");
				amount.append(NumberUI.element(event.amount, { role: "amount", unit: event.unit }));
				if (NumberUI.format(event.amount).text.length > 11) row.classList.add("record-event-wide");
				row.append(amount);
			},
			Moment(event, copy, row) {
				row.prepend(e("span", "record-marker"));
				copy.append(e("p", "record-event-title", event.title));
			},
			Revision(event, copy, row) {
				row.prepend(e("span", "record-marker"));
				copy.append(e("p", "record-event-title", event.title));
				const diff = e("div", "record-diff");
				if (event.before !== null) {
					const before = e("span", "record-before");
					before.append(e("span", "sr-only", "原内容："), e("s", "", event.before));
					diff.append(before);
				}
				if (event.before !== null && event.after !== null) {
					const arrow = e("span", "record-diff-arrow", "→");
					arrow.setAttribute("aria-hidden", "true");
					diff.append(arrow);
				}
				if (event.after !== null) {
					const after = e("span", "record-after");
					after.append(e("span", "sr-only", "新内容："), e("span", "", event.after));
					diff.append(after);
				}
				copy.append(diff, e("p", "record-version", "版本 " + event.version));
			},
			PhaseResult(event, copy, row) {
				row.prepend(e("span", "record-marker"));
				copy.append(e("p", "record-phase", event.phase), e("p", "record-event-title", event.title));
			},
		};
		for (const group of view.groups) {
			const details = e("details", "record-group");
			details.dataset.round = group.id;
			details.open = memory.open.has(group.id);
			const summary = e("summary", "record-round"),
				heading = e("span", "record-round-heading");
			heading.append(
				e("span", "record-round-title", group.title),
				e("span", "record-recap", group.recap),
			);
			summary.append(heading);
			if (group.metric) {
				const metric = e("span", "record-round-metric");
				metric.append(
					e("span", "record-metric-label", group.metric.label),
					NumberUI.element(group.metric.value, {
						role: "amount",
						unit: group.metric.unit,
						signed: !!group.metric.signed,
					}),
				);
				if (NumberUI.format(group.metric.value).text.length > 11)
					summary.classList.add("record-round-wide");
				summary.append(metric);
			} else if (group.status === "in-progress")
				summary.append(e("span", "record-progress", "进行中"));
			summary.append(chevron());
			details.append(summary);
			const body = e("div", "record-body"),
				events = e("ol", "record-events");
			events.setAttribute("aria-label", group.title + "的经过");
			for (const event of group.events) {
				const row = e("li", "record-event record-" + event.type),
					copy = e("div", "record-event-copy");
				row.append(copy);
				renderers[event.type](event, copy, row);
				if (event.detail) copy.append(e("p", "record-event-detail", event.detail));
				if (event.facts) copy.append(facts(event.facts));
				events.append(row);
			}
			if (group.events.length) body.append(events);
			else body.append(e("p", "record-empty", "本轮还没有已确认的动作。"));
			if (group.snapshot) {
				const snapshot = e("details", "record-snapshot");
				snapshot.open = memory.snapshots.has(group.id);
				const trigger = e("summary", "record-snapshot-trigger");
				trigger.append(e("span", "", group.snapshot.label), chevron());
				snapshot.append(trigger);
				const lines = e("ol", "record-document");
				for (const line of group.snapshot.lines) lines.append(e("li", "", line));
				snapshot.append(lines);
				snapshot.addEventListener("toggle", () => {
					if (snapshot.open) memory.snapshots.add(group.id);
					else memory.snapshots.delete(group.id);
				});
				body.append(snapshot);
			}
			details.append(body);
			details.addEventListener("toggle", () => {
				if (details.open) memory.open.add(group.id);
				else memory.open.delete(group.id);
			});
			root.append(details);
		}
		window.SGGControls?.enhance(root);
		requestAnimationFrame(() => (root.scrollTop = memory.scroll));
		return root;
	}
	window.GameRecords = { render };
})();

			byline.innerHTML = SGGInlinePerson.html(
				c.viewer,
				Object.fromEntries(c.people.map((p) => [p.id, { name: p.name }])),
				{ viewerId: c.viewer, selfMarker: true },
			);
		const note = e("p", "quota", SGGProductLanguage.quota(c.remaining));
		document.querySelector(".newpost-footer").prepend(note);
	}
	if (app === "dm") {
		const count = document.querySelector(".compose-meta b");
		if (count) count.textContent = c.remaining;
		const createBudget = document.querySelector(".create-budget");
		if (createBudget) createBudget.textContent = SGGProductLanguage.quota(c.remaining);
		if (A.readonly) {
			const composer = document.querySelector(".dm-compose");
			if (composer) composer.hidden = true;
			document.querySelector(".dm-empty button").hidden = true;
		}
	}
	if (app === "rating") {
		const listBack = document.querySelector("#back-list");
		listBack.addEventListener(
			"click",
			(event) => {
				if (!document.querySelector(".rating-app").classList.contains("mobile-detail")) {
					event.preventDefault();
					event.stopImmediatePropagation();
					A.close();
				}
			},
			true,
		);
	}
	if (app === "game") {
		const toolbar = e("nav", "sg-game-toolbar");
		toolbar.setAttribute("aria-label", "游戏应用");
		const backButton = SGGButtons.create({
				role: "icon",
				ariaLabel: "返回应用桌面",
				icon: SGGIcons.create("back"),
			}),
			title = e("h2", "", "游戏"),
			end = e("span", "toolbar-end"),
			records = SGGButtons.create({
				role: "icon",
				ariaLabel: "游戏记录",
				icon: SGGIcons.create("records"),
			});
		backButton.classList.add("sg-game-back");
		if (c.returnTo === "questionnaire") backButton.setAttribute("aria-label", "返回问卷");
		else backButton.classList.add("sg-root-back");
		backButton.onclick = () => A.close();
		records.onclick = () => A.request("ui.records").catch(() => {});
		end.append(records);
		toolbar.append(backButton, title, end);
		SGGLayout.toolbar(toolbar);
		toolbar.classList.add("sg-shell-width");
		document.querySelector("#app").before(toolbar);
		const form = document.querySelector("#game-decision");
		form?.addEventListener(
			"submit",
			async (event) => {
				event.preventDefault();
				event.stopImmediatePropagation();
				if (A.readonly) return;
				const b =
					document.querySelector("button[form=game-decision]") ||
					form.querySelector("[type=submit]");
				b.disabled = true;
				try {
					await A.submit(b, "game.submit", GameUiPreview.readDraft());
				} catch (error) {
					let note = document.querySelector(".action-footer .inline-note");
					if (note) {
						note.textContent = error.message;
						note.classList.add("visible");
					}
					b.disabled = false;
				}
			},
			true,
		);
	}
	if (app === "game" && c.waiting) {
		const heading = document.querySelector(".intro h1"),
			description = document.querySelector(".intro>p");
		if (heading) heading.textContent = "已提交";
		if (description) description.textContent = "正在等待其他玩家。";
	}
	if (app === "game" && window.GameUiPreview?.screen === "result")
		document.querySelector(".action-footer")?.remove();
	readonly();
	document.documentElement.dataset.sessionReady = "true";
})();
</script><script>/* Acknowledge visible content IDs from this document's authorized snapshot, never a target alone. */
(() => {
	"use strict";
	const A = window.SessionApp;
	if (!A || A.app === "profile") return;
	let visible = true,
		scheduled = false;
	const acknowledged = new Set();
	const inView = (node) => {
		if (!node || !node.getClientRects().length) return false;
		const r = node.getBoundingClientRect();
		let left = Math.max(r.left, 0),
			right = Math.min(r.right, innerWidth),
			top = Math.max(r.top, 0),
			bottom = Math.min(r.bottom, innerHeight);
		for (let parent = node.parentElement; parent; parent = parent.parentElement) {
			const style = getComputedStyle(parent),
				box = parent.getBoundingClientRect();
			if (/^(auto|scroll|hidden|clip)$/.test(style.overflowX)) {
				left = Math.max(left, box.left + parent.clientLeft);
				right = Math.min(right, box.left + parent.clientLeft + parent.clientWidth);
			}
			if (/^(auto|scroll|hidden|clip)$/.test(style.overflowY)) {
				top = Math.max(top, box.top + parent.clientTop);
				bottom = Math.min(bottom, box.top + parent.clientTop + parent.clientHeight);
			}
		}
		return (
			right > left &&
			bottom > top &&
			(right - left) * (bottom - top) >=
				Math.min(r.height, innerHeight) * Math.min(r.width, innerWidth) * 0.5
		);
	};
	function inspect() {
		scheduled = false;
		if (!visible || document.hidden) return;
		const events = A.context.appNoticeEvents?.[A.app] || {},
			pendingRecords = new Set(
				Object.values(events)
					.flat()
					.filter((id) => !acknowledged.has(id)),
			),
			visibleRecords = new Set(
				[...document.querySelectorAll("[data-notice-record]")]
					.filter((n) => pendingRecords.has(n.dataset.noticeRecord) && inView(n))
					.map((n) => n.dataset.noticeRecord),
			);
		for (const [target, ids] of Object.entries(events)) {
			let readable = [];
			if (A.app === "forum" || A.app === "dm")
				readable = ids.filter((id) => visibleRecords.has(id));
			else if (A.app === "rating") {
				const app = document.querySelector(".rating-app"),
					selected = document.querySelector("[data-player][aria-current=true]");
				if (
					(!matchMedia("(max-width:760px)").matches || app?.classList.contains("mobile-detail")) &&
					selected?.dataset.player === target &&
					inView(document.querySelector(".rating-summary"))
				)
					readable = ids;
			}
			const fresh = readable.filter((id) => !acknowledged.has(id));
			if (!fresh.length) continue;
			fresh.forEach((id) => acknowledged.add(id));
			A.request("ui.seen", { ids: [target], recordIds: fresh }).catch(() =>
				fresh.forEach((id) => acknowledged.delete(id)),
			);
		}
	}
	function schedule() {
		if (!scheduled) {
			scheduled = true;
			requestAnimationFrame(inspect);
		}
	}
	new MutationObserver(schedule).observe(document.body, {
		subtree: true,
		childList: true,
		attributes: true,
		attributeFilter: ["hidden", "class", "aria-current"],
	});
	addEventListener("scroll", schedule, true);
	addEventListener("resize", schedule);
	addEventListener("sgg:notice-update", () => {
		if (A.app === "dm")
			for (const row of document.querySelectorAll("[data-conversation]")) {
				const dot = row.querySelector(".unread-dot");
				if (dot) dot.hidden = !A.context.appNoticeEvents?.dm?.[row.dataset.conversation]?.length;
			}
		schedule();
	});
	addEventListener("visibilitychange", schedule);
	addEventListener("message", (event) => {
		if (event.source !== parent) return;
		if (event.data?.channel === "q146-app-visibility") visible = Boolean(event.data.visible);
		schedule();
	});
	schedule();
})();
