(() => {
	"use strict";
	function create(definition, initial) {
		const supported = new Set(definition.locales.map((l) => l.id));
		let locale = supported.has(initial) ? initial : definition.fallback;
		const listeners = new Set(),
			missing = new Set(),
			source = new Map();
		for (const [key, entry] of Object.entries(definition.messages))
			for (const value of Object.values(entry))
				if (typeof value === "string" && !source.has(value)) source.set(value, key);
		function t(key, values = {}) {
			const entry = definition.messages[key];
			if (!entry || entry[locale] === undefined) {
				missing.add(key);
				return key;
			}
			let message = entry[locale];
			if (typeof message === "object") {
				const count = Number(values.count ?? 0),
					category = new Intl.PluralRules(locale).select(count);
				message = message[category] ?? message.other;
			}
			return String(message).replace(/\{([A-Za-z][\w]*)\}/g, (slot, name) =>
				Object.hasOwn(values, name) ? String(values[name]) : slot,
			);
		}
		return Object.freeze({
			get locale() {
				return locale;
			},
			definition,
			get missingKeys() {
				return [...missing];
			},
			t,
			systemCopy(message, values) {
				const key = source.get(message);
				return key ? t(key, values) : message;
			},
			set(next) {
				if (!supported.has(next) || next === locale) return;
				locale = next;
				for (const listener of listeners) listener();
			},
			subscribe(listener) {
				listeners.add(listener);
				return () => listeners.delete(listener);
			},
		});
	}
	globalThis.SGGI18nCore = Object.freeze({ create });
})();

(() => {
	"use strict";
	const definition = window.SGGI18nDefinition,
		key = definition.preferenceKey;
	let saved;
	try {
		saved = localStorage.getItem(key);
	} catch {}
	const supported = new Set(definition.locales.map((l) => l.id));
	const browser = (navigator.languages || [navigator.language])
		.map((l) => l.toLowerCase())
		.map((l) => (l.startsWith("zh") ? "zh-CN" : l.startsWith("en") ? "en" : null))
		.find(Boolean);
	const initial = supported.has(window.__SGG_LOCALE__)
		? window.__SGG_LOCALE__
		: supported.has(saved)
			? saved
			: definition.initial === "browser"
				? browser
				: definition.fallback;
	const store = SGGI18nCore.create(definition, initial),
		bindings = new Map(),
		scopes = new Map();
	// Only detached element removals trigger cleanup; text/attribute updates never scan scopes.
	let cleanupQueued = false;
	const removedRoots = new Set();
	function scheduleCleanup() {
		if (cleanupQueued) return;
		cleanupQueued = true;
		queueMicrotask(() => {
			cleanupQueued = false;
			const detached = (node) =>
				!node.isConnected && [...removedRoots].some((root) => root.contains(node));
			for (const [node] of bindings) if (detached(node)) bindings.delete(node);
			for (const [token, scope] of scopes) {
				if (detached(scope.node)) {
					scope.unsubscribe();
					scopes.delete(token);
				}
			}
			removedRoots.clear();
		});
	}
	new MutationObserver((records) => {
		for (const record of records)
			for (const node of record.removedNodes) if (node.nodeType === 1) removedRoots.add(node);
		if (removedRoots.size) scheduleCleanup();
	}).observe(document.documentElement, { childList: true, subtree: true });
	function observe(node, listener) {
		const token = {},
			unsubscribe = store.subscribe(listener);
		scopes.set(token, { node, unsubscribe });
		return () => {
			unsubscribe();
			scopes.delete(token);
		};
	}
	function notifyChildren() {
		for (const child of document.querySelectorAll("iframe")) {
			try {
				child.contentWindow?.postMessage(
					{ channel: "sgg:locale", locale: store.locale },
					location.origin,
				);
			} catch {}
		}
	}
	function apply() {
		document.documentElement.lang = store.locale;
		document.documentElement.dir =
			definition.locales.find((l) => l.id === store.locale)?.direction || "ltr";
		for (const [node, slots] of bindings) {
			if (!node.isConnected) {
				bindings.delete(node);
				continue;
			}
			for (const update of slots.values()) update();
		}
		notifyChildren();
		document.dispatchEvent(
			new CustomEvent("sgg:localechange", { detail: { locale: store.locale } }),
		);
	}
	function set(locale) {
		if (!supported.has(locale)) return;
		try {
			localStorage.setItem(key, locale);
		} catch {}
		store.set(locale);
	}
	function bind(node, message, { attr, values = {} } = {}) {
		const slot = attr || "text",
			update = () => {
				const text = store.t(message, values);
				if (attr) node.setAttribute(attr, text);
				else node.textContent = text;
			};
		const slots = bindings.get(node) || new Map();
		slots.set(slot, update);
		bindings.set(node, slots);
		update();
		return () => {
			slots.delete(slot);
			if (!slots.size) bindings.delete(node);
		};
	}
	const attrs = ["aria-label", "aria-description", "placeholder", "title"];
	function bindAllAnnotated(scope = document) {
		const selector = ["[data-sg-copy]", ...attrs.map((a) => "[data-sg-copy-" + a + "]")].join(",");
		const nodes = [
			...(scope.matches?.(selector) ? [scope] : []),
			...scope.querySelectorAll(selector),
		];
		for (const node of nodes) {
			if (node.dataset.sgCopy) bind(node, node.dataset.sgCopy);
			for (const attr of attrs) {
				const message = node.getAttribute("data-sg-copy-" + attr);
				if (message) bind(node, message, { attr });
			}
		}
	}
	window.SGGI18n = Object.freeze({
		...store,
		get locale() {
			return store.locale;
		},
		get missingKeys() {
			return store.missingKeys;
		},
		set,
		observe,
		bind,
		bindAllAnnotated,
	});
	store.subscribe(apply);
	window.addEventListener("storage", (e) => {
		if (e.key === key && supported.has(e.newValue)) store.set(e.newValue);
	});
	window.addEventListener("message", (e) => {
		if (
			e.origin !== location.origin ||
			e.source !== parent ||
			e.data?.channel !== "sgg:locale" ||
			!supported.has(e.data.locale)
		)
			return;
		store.set(e.data.locale);
	});
	document.addEventListener(
		"load",
		(e) => {
			if (e.target?.tagName === "IFRAME") notifyChildren();
		},
		true,
	);
	document.addEventListener(
		"DOMContentLoaded",
		() => {
			apply();
			bindAllAnnotated(document);
		},
		{ once: true },
	);
	apply();
})();

(() => {
	"use strict";
	const boot = () => {
		if (window.parent !== window) {
			try {
				if (parent.SGGI18n) {
					document.documentElement.dataset.sgLanguageControl = "";
					return;
				}
			} catch {}
		}
		if (document.querySelector(".sg-language-control[data-sg-language-control]")) return;
		const I = window.SGGI18n,
			wrapper = document.createElement("div");
		wrapper.className = "sg-language-control";
		wrapper.dataset.sgLanguageControl = "";
		const trigger = SGGButtons.create({
			role: "icon",
			icon: SGGIcons.create("language"),
			ariaLabel: "Language / 语言",
		});
		trigger.id = "sg-language-trigger";
		trigger.setAttribute("aria-haspopup", "menu");
		trigger.setAttribute("aria-expanded", "false");
		trigger.setAttribute("aria-controls", "sg-language-menu");
		const menu = document.createElement("div");
		menu.className = "sg-language-menu";
		menu.id = "sg-language-menu";
		menu.setAttribute("role", "menu");
		menu.setAttribute("aria-labelledby", trigger.id);
		menu.setAttribute("popover", "auto");
		const live = document.createElement("span");
		live.className = "sg-icon-label";
		live.setAttribute("role", "status");
		live.setAttribute("aria-live", "polite");
		const options = I.definition.locales.map((language) => {
			const option = SGGButtons.create({ role: "quiet", label: language.name });
			option.setAttribute("role", "menuitemradio");
			option.setAttribute("lang", language.id);
			option.dataset.locale = language.id;
			option.tabIndex = -1;
			const check = SGGIcons.create("check");
			check.classList.add("sg-language-check");
			option.append(check);
			option.onclick = () => {
				I.set(language.id);
				live.textContent = I.t("locale.changed", { name: language.name });

	"use strict";
	const root = document.documentElement,
		reduced = matchMedia("(prefers-reduced-motion:reduce)"),
		active = new Map(),
		origins = new Map(),
		listeners = new Set();

		if (
			![
				"enter",
				"exit",
				"state",
				"press",
				"release",
				"expand",
				"collapse",
				"app-open",
				"app-close",
				"gateway",
			].includes(role)

		return {
			duration: parseFloat(css.getPropertyValue("--sg-motion-" + role)) || 0,
			easing:
				css.getPropertyValue(role === "gateway" ? "--sg-ease-gateway" : "--sg-ease").trim() ||
				"linear",
		};
	}

		const a = active.get(node);
		active.delete(node);
		a?.cancel();
	}
	function input(value) {
		if (!["keyboard", "pointer"].includes(value)) return;
		root.dataset.sgMotionInput = value;
		if (value === "keyboard") settle();
	}
	function settle() {
		for (const node of active.keys()) cancel(node);
		for (const fn of listeners) fn();

	});

		if (e.source === parent && e.data?.channel === "q146-app-visibility") {

	});

	document.addEventListener(
		"click",
		(e) => {
			const summary = e.target.closest?.("summary");
			if (!summary || summary.closest("#stage")) return;
			const details = summary.parentElement;
			if (details.tagName !== "DETAILS") return;
			details.dataset.sgDisclosureInput = instant(e) ? "instant" : "pointer";

		true,
	);

		"toggle",
		(e) => {
			const details = e.target;
			if (
				details.tagName !== "DETAILS" ||
				!details.open ||
				details.dataset.sgDisclosureInput !== "pointer"

				return;
			details.dataset.sgDisclosureInput = "";
			for (const child of details.children) if (child.tagName !== "SUMMARY") reveal(child);
		},
		true,
	);

		version: "sgg.motion/1",
		options,
		instant,
		input,
		cancel,
		run,
		reveal,
		scene,
		app,
		gateway,
		onSettle(fn) {
			listeners.add(fn);
			return () => listeners.delete(fn);
		},
		get reduced() {
			return reduced.matches;
		},
	});
})();

</style><script>/* Product-wide identity text. Only explicit authorised IDs may resolve to names. */
(() => {
	"use strict";
	const settings = { avatars: true, order: "at-name-avatar" };
	const element = (tag, cls, text) => {
		const n = document.createElement(tag);
		if (cls) n.className = cls;
		if (text != null) n.textContent = String(text);
		return n;
	};
	const localized = (n, key, live = true) => {
		n.dataset.sgCopy = key;
		if (live) SGGI18n.bind(n, key);
		else n.textContent = SGGI18n.t(key);
		return n;
	};
	const resolve = (id, identities) => {
		const value = identities && Object.hasOwn(identities, id) ? identities[id] : null;
		return typeof value?.name === "string" && value.name ? value : null;
	};
	function label(
		id,
		identities,
		{
			mention = false,
			viewerId,
			selfMarker = false,
			avatar = settings.avatars,
			order = settings.order,
			live = true,
		} = {},
	) {
		const value = resolve(id, identities);
		if (!value) return localized(element("span", "sg-person-unknown"), "asset.unknownPerson", live);
		if (mention && id === viewerId)
			return localized(element("span", "sg-person-self"), "asset.you", live);
		const n = element(
			mention ? "button" : "span",
			mention ? "sg-person-mention sg-person-link" : "sg-person-name",
		);
		n.dataset.person = id;
		if (mention) {
			n.type = "button";
			n.dataset.sgProfilePerson = id;
			n.dataset.sgPersonName = value.name;
			if (live)
				SGGI18n.bind(n, "asset.personProfile", {
					attr: "aria-label",
					values: { name: value.name },
				});
			else n.setAttribute("aria-label", SGGI18n.t("asset.personProfile", { name: value.name }));
		}
		if (mention && avatar && window.SGGAvatar) {
			n.classList.add("sg-person-inline");
			n.dataset.personOrder = order;
			const at = element("span", "sg-person-at", "@"),
				name = element(
					"span",
					"sg-person-visible-name",
					value.name.startsWith("@") ? value.name.slice(1) : value.name,
				),
				image = SGGAvatar.node({ preset: value.avatar || "default", size: "message", person: id });
			at.setAttribute("aria-hidden", "true");
			if (order === "at-name-avatar") {
				const text = element("span", "sg-person-text");
				text.append(at, name);
				n.append(text, image);
			} else if (order === "avatar-at-name") {
				const text = element("span", "sg-person-text");
				text.append(at, name);
				n.append(image, text);
			} else {
				n.append(at, image, name);
			}
		} else {
			if (mention && !value.name.startsWith("@")) {
				const at = element("span", "sg-person-at", "@");
				at.setAttribute("aria-hidden", "true");
				n.append(at);
			}
			n.append(document.createTextNode(value.name));
		}
		if (!mention && selfMarker && id === viewerId)
			n.append(localized(element("span", "sg-person-you"), "asset.you", live));
		return n;
	}

	function person(id, identities, options = {}) {
		return label(id, identities, { ...options, mention: true });
	}
	function render(
		root,
		parts,
		{ identities, viewerId, avatar = settings.avatars, order = settings.order } = {},
	) {
		root.replaceChildren();
		for (const part of parts) {
			if (part && typeof part === "object") {
				if (typeof part.personId !== "string")
					throw new TypeError("Person part requires an explicit ID");
				root.append(person(part.personId, identities, { viewerId, avatar, order }));
			} else root.append(document.createTextNode(String(part ?? "")));
		}
		return root;
	}
	function replace(root, text, { personId, identities, viewerId } = {}) {
		if (!resolve(personId, identities)) {
			root.textContent = text;
			return;
		}
		const parts = String(text)
			.split("对方")
			.flatMap((part, i) => (i ? [{ personId }, part] : [part]));
		render(root, parts, { identities, viewerId });
	}
	function html(id, identities, options) {
		return label(id, identities, { ...options, live: false }).outerHTML;
	}
	function text(id, identities, options) {
		return label(id, identities, { ...options, live: false }).textContent;
	}
	let opener = null;
	document.addEventListener(
		"click",
		(event) => {
			const link =
				event.target instanceof Element
					? event.target.closest("button[data-sg-profile-person]")
					: null;
			if (!link || link.closest("[inert],[aria-hidden=true]")) return;
			event.preventDefault();
			event.stopPropagation();
			opener = link;
			const detail = { personId: link.dataset.sgProfilePerson, keyboard: event.detail === 0 };
			if (window.SessionApp)
				SessionApp.request("ui.open-profile", {
					target: detail.personId,
					keyboard: detail.keyboard,
				}).catch(() => {});
			else link.dispatchEvent(new CustomEvent("sgg:profile-request", { detail, bubbles: true }));
		},
		true,
	);
	addEventListener("message", (event) => {
		if (
			event.source === parent &&
			event.origin === new URL(document.baseURI).origin &&
			event.data?.channel === "q146-profile-return" &&
			opener?.isConnected
		)
			opener.focus({ preventScroll: true });
	});
	SGGI18n.subscribe(() => {
		// Serialized person HTML keeps explicit owned marker slots; names are verbatim.
		for (const slot of document.querySelectorAll(
			".sg-person-self,.sg-person-you,.sg-person-unknown",
		))
			SGGI18n.bind(
				slot,
				slot.classList.contains("sg-person-unknown") ? "asset.unknownPerson" : "asset.you",
			);
		for (const link of document.querySelectorAll(
			"button[data-sg-profile-person][data-sg-person-name]",
		))
			link.setAttribute(
				"aria-label",
				SGGI18n.t("asset.personProfile", { name: link.dataset.sgPersonName }),
			);
	});
	window.SGGInlinePerson = Object.freeze({
		label,
		person,
		render,
		replace,
		html,
		text,
		configure(options) {
			if (typeof options.avatars === "boolean") settings.avatars = options.avatars;
			if (["at-avatar-name", "avatar-at-name", "at-name-avatar"].includes(options.order))
				settings.order = options.order;
		},
	});
})();
</script><script>/* Display-only language. No phase, quota, identity or permission inference. */
(() => {
	"use strict";
	const positive = (n) => Number.isSafeInteger(Number(n)) && Number(n) > 0;
	const apps = Object.freeze(
		Object.defineProperties(
			{},
			Object.fromEntries(
				["profile", "forum", "dm", "rating", "game", "questionnaire"].map((id) => [
					id,
					{ enumerable: true, get: () => SGGI18n.t("asset." + id) },
				]),
			),
		),
	);
	function quota(count) {
		return Number.isSafeInteger(count) && count >= 0
			? SGGI18n.t("asset.quota", { count })
			: SGGI18n.t("asset.quotaUnavailable");
	}
	function stamp({ round, step, steps } = {}) {
		const parts = [];
		if (positive(round)) parts.push(SGGI18n.t("asset.roundStamp", { round }));
		if (positive(step))
			parts.push(
				positive(steps) && Number(step) <= Number(steps)
					? SGGI18n.t("asset.socialStamp", { step, steps })
					: SGGI18n.t("asset.socialStep", { step }),
			);
		return parts.join(" · ");
	}
	function identities(context) {
		return Object.fromEntries(
			(context?.people || []).map((p) => [
				p.id,
				{ name: p.name, avatar: context.profiles?.[p.id]?.avatar || "default" },
			]),
		);
	}
	window.SGGProductLanguage = Object.freeze({ apps, quota, stamp, identities });
})();

	"use strict";
	const state = new WeakMap();
	const e = (tag, cls, text) => {
		const n = document.createElement(tag);
		if (cls) n.className = cls;
		if (text !== undefined) n.textContent = String(text);
		return n;
	};
	function chevron() {
		const n = e("span", "record-chevron");
		n.setAttribute("aria-hidden", "true");
		n.append(SGGIcons.create("chevron-down"));
		return n;
	}
	function facts(rows) {
		const dl = e("dl", "record-facts");
		for (const f of rows) {
			const row = e("div", "record-fact");
			const value = e("dd", "");
			if (f.numeric)
				value.append(NumberUI.element(f.numeric, { unit: f.unit || "", signed: !!f.signed }));
			else if (f.quantities) {
				value.classList.add("number-pair");
				f.quantities.forEach((q, i) => {
					if (i) value.append(e("span", "number-pair-separator", "/"));
					value.append(NumberUI.element(q.value, { unit: q.unit || "", signed: !!q.signed }));
				});
			} else value.textContent = f.value;
			row.append(e("dt", "", f.label), value);
			dl.append(row);
		}
		return dl;
	}
	function render({ view, identities, viewerId }) {
		const root = e("div", "game-record-list");
		root.setAttribute("aria-label", "游戏记录");
		if (!view) {
			root.append(e("p", "record-empty", "游戏记录暂时无法读取。"));
			return root;
		}
		if (!view.groups.length) {
			root.append(e("p", "record-empty", "还没有游戏记录。"));
			return root;
		}

			open: new Set([view.groups[0].id]),

				const option = e("option", "", g.title);

			}
			select.addEventListener("change", () => {
				const target = root.querySelector('[data-round="' + CSS.escape(select.value) + '"]');
				target.open = true;
				target.scrollIntoView({ block: "start", behavior: "instant" });
			});
			label.append(select);
			root.append(label);
		}

		const renderers = {
			Interaction(event, copy, row) {
				const image = SGGAvatar.node({
					preset: identities[event.actorId]?.avatar || "default",
					size: "reply",
					person: event.actorId,
				});

				row.prepend(image);
				copy.append(
					SGGInlinePerson.render(
						e("p", "record-event-title"),
						[{ personId: event.actorId }, "向 ", { personId: event.targetId }, event.verb],
						{ identities, viewerId },
					),
				);

				amount.append(NumberUI.element(event.amount, { role: "amount", unit: event.unit }));
				if (NumberUI.format(event.amount).text.length > 11) row.classList.add("record-event-wide");
				row.append(amount);
			},
			Moment(event, copy, row) {
				row.prepend(e("span", "record-marker"));
				copy.append(e("p", "record-event-title", event.title));
			},
			Revision(event, copy, row) {
				row.prepend(e("span", "record-marker"));
				copy.append(e("p", "record-event-title", event.title));
				const diff = e("div", "record-diff");
				if (event.before !== null) {
					const before = e("span", "record-before");
					before.append(e("span", "sr-only", "原内容："), e("s", "", event.before));

					const after = e("span", "record-after");

					diff.append(after);
				}
				copy.append(diff, e("p", "record-version", "版本 " + event.version));
			},
			PhaseResult(event, copy, row) {
				row.prepend(e("span", "record-marker"));
				copy.append(e("p", "record-phase", event.phase), e("p", "record-event-title", event.title));
			},
		};
		for (const group of view.groups) {
			const details = e("details", "record-group");
			details.dataset.round = group.id;
			details.open = memory.open.has(group.id);
			const summary = e("summary", "record-round"),
				heading = e("span", "record-round-heading");

				e("span", "record-recap", group.recap),
			);
			summary.append(heading);
			if (group.metric) {
				const metric = e("span", "record-round-metric");
				metric.append(
					e("span", "record-metric-label", group.metric.label),
					NumberUI.element(group.metric.value, {
						role: "amount",
						unit: group.metric.unit,
						signed: !!group.metric.signed,
					}),
				);
				if (NumberUI.format(group.metric.value).text.length > 11)
					summary.classList.add("record-round-wide");
				summary.append(metric);
			} else if (group.status === "in-progress")

			summary.append(chevron());
			details.append(summary);
			const body = e("div", "record-body"),
				events = e("ol", "record-events");
			events.setAttribute("aria-label", group.title + "的经过");
			for (const event of group.events) {
				const row = e("li", "record-event record-" + event.type),

				row.append(copy);
				renderers[event.type](event, copy, row);
				if (event.detail) copy.append(e("p", "record-event-detail", event.detail));
				if (event.facts) copy.append(facts(event.facts));
				events.append(row);
			}
			if (group.events.length) body.append(events);
			else body.append(e("p", "record-empty", "本轮还没有已确认的动作。"));
			if (group.snapshot) {
				const snapshot = e("details", "record-snapshot");
				snapshot.open = memory.snapshots.has(group.id);
				const trigger = e("summary", "record-snapshot-trigger");
				trigger.append(e("span", "", group.snapshot.label), chevron());
				snapshot.append(trigger);
				const lines = e("ol", "record-document");
				for (const line of group.snapshot.lines) lines.append(e("li", "", line));
				snapshot.append(lines);
				snapshot.addEventListener("toggle", () => {
					if (snapshot.open) memory.snapshots.add(group.id);
					else memory.snapshots.delete(group.id);
				});
				body.append(snapshot);
			}
			details.append(body);
			details.addEventListener("toggle", () => {
				if (details.open) memory.open.add(group.id);
				else memory.open.delete(group.id);
			});
			root.append(details);
		}
		window.SGGControls?.enhance(root);
		requestAnimationFrame(() => (root.scrollTop = memory.scroll));
		return root;
	}
	window.GameRecords = { render };
})();

	"use strict";
	const reduced = matchMedia("(prefers-reduced-motion: reduce)"),
		active = new WeakMap(),

		const a = active.get(dialog);
		active.delete(dialog);

		dialog.inert = false;
	}
	function finish(dialog) {
		clear(dialog);
		if (dialog.open) dialog.close();
	}
	function open(dialog, { event, instant = false } = {}) {

			from = style ? { opacity: style.opacity, transform: style.transform } : null;

		if (!dialog.open) {
			// A top-layer reading takes over from an entering scene; never animate both layers.
			for (let parent = dialog.parentElement; parent; parent = parent.parentElement)
				window.SGGMotion?.cancel(parent);
			if (dialog.dataset.keyboardOpen === "true") dialog.removeAttribute("tabindex");
			dialog.showModal();
			// Native showModal autofocus otherwise puts a ring on Close after some pointer paths.
			// The dialog is the initial reading target; Tab still starts at its first control.
			if (dialog.dataset.keyboardOpen !== "true") {
				dialog.tabIndex = -1;
				dialog.focus({ preventScroll: true });
			}
		}
		if (interrupted && from) {
			for (const a of dialog.getAnimations()) a.cancel();
			window.SGGMotion?.run(
				dialog,
				[
					{ ...from, opacity: 1 },
					{ opacity: 1, transform: "translateY(0)" },
				],
				{
					immediate: instant,
					event,
				},
			);
		}
	}
	function close(dialog, { instant = false } = {}) {
		if (!dialog?.open) return;
		if (instant || reduced.matches || window.SGGMotion?.instant()) {
			finish(dialog);
			return;
		}

			from = { opacity: style.opacity, transform: style.transform };

					},
				],

			})

			event.preventDefault();

		});

		for (const d of known) {

			else for (const a of d.getAnimations()) a.cancel();

	});

		if (reduced.matches) for (const d of known) if (active.has(d)) finish(d);
	});

				right = Math.min(right, box.left + parent.clientLeft + parent.clientWidth);

			if (/^(auto|scroll|hidden|clip)$/.test(style.overflowY)) {
				top = Math.max(top, box.top + parent.clientTop);
				bottom = Math.min(bottom, box.top + parent.clientTop + parent.clientHeight);

			right > left &&
			bottom > top &&
