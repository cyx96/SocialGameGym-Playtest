		origins = new Map(),

		if (
			![
				"enter",
				"exit",
				"state",
				"press",
				"release",
				"expand",
				"collapse",
				"app-open",
				"app-close",

			.catch(() => {})

		"toggle",

			const details = e.target;

				!details.open ||
				details.dataset.sgDisclosureInput !== "pointer"

		version: "sgg.motion/1",

		instant,
		input,
		cancel,
		run,
		reveal,
		scene,
		app,
		onSettle(fn) {
			listeners.add(fn);
			return () => listeners.delete(fn);
		},
		get reduced() {
			return reduced.matches;
		},
	});
})();

(() => {
	"use strict";
	const q = new URLSearchParams(location.search);

	let context = window.__SGG_CONTEXT__;
	if (context.themeId) document.documentElement.dataset.sgTheme = context.themeId;

	document.documentElement.dataset.sessionApp = app;
	document.documentElement.dataset.readonly = String(context.readonly);

		return new Promise((resolve, reject) => {
			const id = ++serial,

					parent.postMessage({ channel: "sgg-surface-slow", id }, new URL(document.baseURI).origin);
				}, 8000);

				{ channel: "sgg-surface", id, app, type, data, window: context.window },
				new URL(document.baseURI).origin,
			);
		});

		if (
			e.source === parent &&
			e.origin === new URL(document.baseURI).origin &&
			e.data?.channel === "q146-notices"
		) {
			context = { ...context, ...e.data.context };
			dispatchEvent(new Event("sgg:notice-update"));
			return;
		}
		if (
			e.source !== parent ||
			e.origin !== new URL(document.baseURI).origin ||
			e.data?.channel !== "sgg-surface-response"
		)
			return;

		if (!p) {
			parent.postMessage(
				{ channel: "sgg-surface-ack", id: e.data.id },
				new URL(document.baseURI).origin,
			);

		}

		pending.delete(e.data.id);

		// srcdoc frames can lose the exact sender Window. postMessage already queues
		// delivery after the promise reactions below have cleared the local draft.
		if (e.data.error) {
			p.reject(Error(e.data.error));
			parent.postMessage(
				{ channel: "sgg-surface-ack", id: e.data.id },

		},
		get readonly() {
			return context.readonly;

			send("ui.close", {

		},

			send("ui.refresh").catch(() => {});
		},
		get app() {
			return app;
		},
	};

</style><script>/* Product-wide identity text. Only explicit authorised IDs may resolve to names. */
(() => {
	"use strict";
	const settings = { avatars: true, order: "at-name-avatar" };
	const element = (tag, cls, text) => {
		const n = document.createElement(tag);
		if (cls) n.className = cls;
		if (text != null) n.textContent = String(text);
		return n;
	};
	const resolve = (id, identities) => {
		const value = identities && Object.hasOwn(identities, id) ? identities[id] : null;
		return typeof value?.name === "string" && value.name ? value : null;
	};
	function label(
		id,
		identities,
		{
			mention = false,
			viewerId,
			selfMarker = false,
			avatar = settings.avatars,
			order = settings.order,
		} = {},
	) {
		const value = resolve(id, identities);
		if (!value) return element("span", "sg-person-unknown", "该玩家");
		if (mention && id === viewerId) return element("span", "sg-person-self", "你");
		const n = element(
			mention ? "button" : "span",
			mention ? "sg-person-mention sg-person-link" : "sg-person-name",
		);
		n.dataset.person = id;
		if (mention) {
			n.type = "button";
			n.dataset.sgProfilePerson = id;
			n.setAttribute("aria-label", "查看" + value.name + "的资料");
		}
		if (mention && avatar && window.SGGAvatar) {
			n.classList.add("sg-person-inline");
			n.dataset.personOrder = order;
			const at = element("span", "sg-person-at", "@"),
				name = element(
					"span",
					"sg-person-visible-name",
					value.name.startsWith("@") ? value.name.slice(1) : value.name,
				),
				image = SGGAvatar.node({ preset: value.avatar || "default", size: "message", person: id });
			at.setAttribute("aria-hidden", "true");
			if (order === "at-name-avatar") {
				const text = element("span", "sg-person-text");
				text.append(at, name);
				n.append(text, image);
			} else if (order === "avatar-at-name") {
				const text = element("span", "sg-person-text");
				text.append(at, name);
				n.append(image, text);
			} else {
				n.append(at, image, name);
			}
		} else {
			if (mention && !value.name.startsWith("@")) {
				const at = element("span", "sg-person-at", "@");
				at.setAttribute("aria-hidden", "true");
				n.append(at);
			}
			n.append(document.createTextNode(value.name));
		}
		if (!mention && selfMarker && id === viewerId) n.append(element("span", "sg-person-you", "你"));
		return n;
	}

	function person(id, identities, options = {}) {
		return label(id, identities, { ...options, mention: true });
	}
	function render(
		root,
		parts,
		{ identities, viewerId, avatar = settings.avatars, order = settings.order } = {},
	) {
		root.replaceChildren();
		for (const part of parts) {
			if (part && typeof part === "object") {
				if (typeof part.personId !== "string")
					throw new TypeError("Person part requires an explicit ID");
				root.append(person(part.personId, identities, { viewerId, avatar, order }));
			} else root.append(document.createTextNode(String(part ?? "")));
		}
		return root;
	}
	function replace(root, text, { personId, identities, viewerId } = {}) {
		if (!resolve(personId, identities)) {
			root.textContent = text;
			return;
		}
		const parts = String(text)
			.split("对方")
			.flatMap((part, i) => (i ? [{ personId }, part] : [part]));
		render(root, parts, { identities, viewerId });
	}
	function html(id, identities, options) {
		return label(id, identities, options).outerHTML;
	}
	function text(id, identities, options) {
		return label(id, identities, options).textContent;
	}
	let opener = null;
	document.addEventListener(
		"click",
		(event) => {
			const link =
				event.target instanceof Element
					? event.target.closest("button[data-sg-profile-person]")
					: null;
			if (!link || link.closest("[inert],[aria-hidden=true]")) return;
			event.preventDefault();
			event.stopPropagation();
			opener = link;
			const detail = { personId: link.dataset.sgProfilePerson, keyboard: event.detail === 0 };
			if (window.SessionApp)
				SessionApp.request("ui.open-profile", {
					target: detail.personId,
					keyboard: detail.keyboard,
				}).catch(() => {});
			else link.dispatchEvent(new CustomEvent("sgg:profile-request", { detail, bubbles: true }));
		},
		true,
	);
	addEventListener("message", (event) => {
		if (
			event.source === parent &&
			event.origin === new URL(document.baseURI).origin &&
			event.data?.channel === "q146-profile-return" &&
			opener?.isConnected
		)
			opener.focus({ preventScroll: true });
	});
	window.SGGInlinePerson = Object.freeze({
		label,
		person,
		render,
		replace,
		html,
		text,
		configure(options) {
			if (typeof options.avatars === "boolean") settings.avatars = options.avatars;
			if (["at-avatar-name", "avatar-at-name", "at-name-avatar"].includes(options.order))
				settings.order = options.order;
		},
	});
})();
</script><script>/* Display-only language. No phase, quota, identity or permission inference. */
(() => {
	"use strict";
	const positive = (n) => Number.isSafeInteger(Number(n)) && Number(n) > 0;
	const apps = Object.freeze({
		profile: "资料",
		forum: "论坛",
		dm: "私信",
		rating: "评分",
		game: "游戏",
		questionnaire: "问卷",
	});
	function quota(count) {
		return Number.isSafeInteger(count) && count >= 0 ? "本步剩余 " + count + " 次" : "次数暂不可用";
	}
	function stamp({ round, step, steps } = {}) {
		const parts = [];
		if (positive(round)) parts.push("第 " + round + " 轮");
		if (positive(step))
			parts.push(
				positive(steps) && Number(step) <= Number(steps)
					? "社交 " + step + "/" + steps + " 步"
					: "社交第 " + step + " 步",
			);
		return parts.join(" · ");
	}
	function identities(context) {
		return Object.fromEntries(
			(context?.people || []).map((p) => [
				p.id,
				{ name: p.name, avatar: context.profiles?.[p.id]?.avatar || "default" },
			]),
		);
	}
	window.SGGProductLanguage = Object.freeze({ apps, quota, stamp, identities });
})();

			rememberDraft();
		}
	}
	for (const input of [name, bio])
		input.addEventListener("input", () => {
			validateFields();
			rememberDraft();
		});
	form.onsubmit = (e) => {
		e.preventDefault();
		const b = toolbar.querySelector(".sg-toolbar-trailing");
		if (b) save(b, e);
	};
	main.addEventListener(
		"scroll",
		(e) => {
			if (!editing) {
				savedScroll = e.target.scrollTop;
				sessionStorage.setItem(scrollKey, savedScroll);
			}
		},
		{ passive: true },
	);
	SGGReading.enhance(dialog);
	dialog.addEventListener("close", () => {
		const id = selected;
		selected = null;
		activityGeneration++;
		activityCleanup();
		const row = [...list.querySelectorAll("[data-person]")].find((n) => n.dataset.person === id);
		(row || filter.querySelector('[aria-pressed="true"]'))?.focus({ preventScroll: true });
	});
	dialog.addEventListener("cancel", () => activityGeneration++);
	dialog.addEventListener("click", (e) => {
		if (e.target === dialog) {
			const r = dialog.getBoundingClientRect();
			if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)
				SGGReading.close(dialog);
		}
	});
	addEventListener("message", (event) => {
		if (
			event.source === parent &&
			event.origin === new URL(document.baseURI).origin &&
			event.data?.channel === "q146-app-visibility"
		) {
			appVisible = Boolean(event.data.visible);
			if (appVisible) dispatchEvent(new Event("sgg:app-visible"));
		}
	});
	if (peek) {
		document.addEventListener("keydown", (event) => {
			if (event.key === "Escape") {
				event.preventDefault();
				event.stopPropagation();
				A.close();
			}
		});
		const person = A.context.people.find((p) => p.id === peek);
		if (person) detail(person);
		else {
			dialog.setAttribute("open", "");
			document
				.querySelector("#detail-body")
				.append(node("p", "profile-error", "暂时无法读取该玩家资料。"));
		}
		const measure = () =>
			parent.postMessage(
				{
					channel: "sgg-profile-size",
					height: Math.ceil(document.body.getBoundingClientRect().height),
				},
				new URL(document.baseURI).origin,
			);
		new ResizeObserver(measure).observe(document.body);
		measure();
	} else {
		let restoreEditor = false;
		try {
			restoreEditor = sessionStorage.getItem(editorKey) === "true";
		} catch {}
		if ((initial || restoreEditor) && canEdit()) edit();
		else showList();
	}
	document.documentElement.dataset.sessionReady = "true";
})();
</script><script>/* Acknowledge visible content IDs from this document's authorized snapshot, never a target alone. */
(() => {
	"use strict";
	const A = window.SessionApp;
	if (!A || A.app === "profile") return;
	let visible = true,
		scheduled = false;
	const acknowledged = new Set();
	const inView = (node) => {
		if (!node || !node.getClientRects().length) return false;
		const r = node.getBoundingClientRect();
		let left = Math.max(r.left, 0),
			right = Math.min(r.right, innerWidth),
			top = Math.max(r.top, 0),
			bottom = Math.min(r.bottom, innerHeight);
		for (let parent = node.parentElement; parent; parent = parent.parentElement) {
			const style = getComputedStyle(parent),
				box = parent.getBoundingClientRect();
			if (/^(auto|scroll|hidden|clip)$/.test(style.overflowX)) {
				left = Math.max(left, box.left + parent.clientLeft);
				right = Math.min(right, box.left + parent.clientLeft + parent.clientWidth);
			}
			if (/^(auto|scroll|hidden|clip)$/.test(style.overflowY)) {
				top = Math.max(top, box.top + parent.clientTop);
				bottom = Math.min(bottom, box.top + parent.clientTop + parent.clientHeight);
			}
		}
		return (
			right > left &&
			bottom > top &&
			(right - left) * (bottom - top) >=
				Math.min(r.height, innerHeight) * Math.min(r.width, innerWidth) * 0.5
		);
	};
	function inspect() {
		scheduled = false;
		if (!visible || document.hidden) return;
		const events = A.context.appNoticeEvents?.[A.app] || {},
			pendingRecords = new Set(
				Object.values(events)
					.flat()
					.filter((id) => !acknowledged.has(id)),
			),
			visibleRecords = new Set(
				[...document.querySelectorAll("[data-notice-record]")]
					.filter((n) => pendingRecords.has(n.dataset.noticeRecord) && inView(n))
					.map((n) => n.dataset.noticeRecord),
			);
		for (const [target, ids] of Object.entries(events)) {
			let readable = [];
			if (A.app === "forum" || A.app === "dm")
				readable = ids.filter((id) => visibleRecords.has(id));
			else if (A.app === "rating") {
				const app = document.querySelector(".rating-app"),
					selected = document.querySelector("[data-player][aria-current=true]");
				if (
					(!matchMedia("(max-width:760px)").matches || app?.classList.contains("mobile-detail")) &&
					selected?.dataset.player === target &&
					inView(document.querySelector(".rating-summary"))
				)
					readable = ids;
			}
			const fresh = readable.filter((id) => !acknowledged.has(id));
			if (!fresh.length) continue;
			fresh.forEach((id) => acknowledged.add(id));
			A.request("ui.seen", { ids: [target], recordIds: fresh }).catch(() =>
				fresh.forEach((id) => acknowledged.delete(id)),
			);
		}
	}
	function schedule() {
		if (!scheduled) {
			scheduled = true;
			requestAnimationFrame(inspect);
		}
	}
	new MutationObserver(schedule).observe(document.body, {
		subtree: true,
		childList: true,
		attributes: true,
		attributeFilter: ["hidden", "class", "aria-current"],
	});
	addEventListener("scroll", schedule, true);
	addEventListener("resize", schedule);
	addEventListener("sgg:notice-update", () => {
		if (A.app === "dm")
			for (const row of document.querySelectorAll("[data-conversation]")) {
				const dot = row.querySelector(".unread-dot");
				if (dot) dot.hidden = !A.context.appNoticeEvents?.dm?.[row.dataset.conversation]?.length;
			}
		schedule();
	});
	addEventListener("visibilitychange", schedule);
	addEventListener("message", (event) => {
		if (event.source !== parent) return;
		if (event.data?.channel === "q146-app-visibility") visible = Boolean(event.data.visible);
		schedule();
	});
	schedule();
})();
