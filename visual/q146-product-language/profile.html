(() => {
	"use strict";
	function create(definition, initial) {
		const supported = new Set(definition.locales.map((l) => l.id));
		let locale = supported.has(initial) ? initial : definition.fallback;
		const listeners = new Set(),
			missing = new Set(),
			source = new Map();
		for (const [key, entry] of Object.entries(definition.messages))
			for (const value of Object.values(entry))
				if (typeof value === "string" && !source.has(value)) source.set(value, key);
		function t(key, values = {}) {
			const entry = definition.messages[key];
			if (!entry || entry[locale] === undefined) {
				missing.add(key);
				return key;
			}
			let message = entry[locale];
			if (typeof message === "object") {
				const count = Number(values.count ?? 0),
					category = new Intl.PluralRules(locale).select(count);
				message = message[category] ?? message.other;
			}
			return String(message).replace(/\{([A-Za-z][\w]*)\}/g, (slot, name) =>
				Object.hasOwn(values, name) ? String(values[name]) : slot,
			);
		}
		return Object.freeze({
			get locale() {
				return locale;
			},
			definition,
			get missingKeys() {
				return [...missing];
			},
			t,
			systemCopy(message, values) {
				const key = source.get(message);
				return key ? t(key, values) : message;
			},
			set(next) {
				if (!supported.has(next) || next === locale) return;
				locale = next;
				for (const listener of listeners) listener();
			},
			subscribe(listener) {
				listeners.add(listener);
				return () => listeners.delete(listener);
			},
		});
	}
	globalThis.SGGI18nCore = Object.freeze({ create });
})();

(() => {
	"use strict";
	const definition = window.SGGI18nDefinition,
		key = definition.preferenceKey;
	let saved;
	try {
		saved = localStorage.getItem(key);
	} catch {}
	const supported = new Set(definition.locales.map((l) => l.id));
	const browser = (navigator.languages || [navigator.language])
		.map((l) => l.toLowerCase())
		.map((l) => (l.startsWith("zh") ? "zh-CN" : l.startsWith("en") ? "en" : null))
		.find(Boolean);
	const initial = supported.has(window.__SGG_LOCALE__)
		? window.__SGG_LOCALE__
		: supported.has(saved)
			? saved
			: definition.initial === "browser"
				? browser
				: definition.fallback;
	const store = SGGI18nCore.create(definition, initial),
		bindings = new Map(),
		scopes = new Map();
	// Only detached element removals trigger cleanup; text/attribute updates never scan scopes.
	let cleanupQueued = false;
	const removedRoots = new Set();
	function scheduleCleanup() {
		if (cleanupQueued) return;
		cleanupQueued = true;
		queueMicrotask(() => {
			cleanupQueued = false;
			const detached = (node) =>
				!node.isConnected && [...removedRoots].some((root) => root.contains(node));
			for (const [node] of bindings) if (detached(node)) bindings.delete(node);
			for (const [token, scope] of scopes) {
				if (detached(scope.node)) {
					scope.unsubscribe();
					scopes.delete(token);
				}
			}
			removedRoots.clear();
		});
	}
	new MutationObserver((records) => {
		for (const record of records)
			for (const node of record.removedNodes) if (node.nodeType === 1) removedRoots.add(node);
		if (removedRoots.size) scheduleCleanup();
	}).observe(document.documentElement, { childList: true, subtree: true });
	function observe(node, listener) {
		const token = {},
			unsubscribe = store.subscribe(listener);
		scopes.set(token, { node, unsubscribe });
		return () => {
			unsubscribe();
			scopes.delete(token);
		};
	}
	function notifyChildren() {
		for (const child of document.querySelectorAll("iframe")) {
			try {
				child.contentWindow?.postMessage(
					{ channel: "sgg:locale", locale: store.locale },
					location.origin,
				);
			} catch {}
		}
	}
	function apply() {
		document.documentElement.lang = store.locale;
		document.documentElement.dir =
			definition.locales.find((l) => l.id === store.locale)?.direction || "ltr";
		for (const [node, slots] of bindings) {
			if (!node.isConnected) {
				bindings.delete(node);
				continue;
			}
			for (const update of slots.values()) update();
		}
		notifyChildren();
		document.dispatchEvent(
			new CustomEvent("sgg:localechange", { detail: { locale: store.locale } }),
		);
	}
	function set(locale) {
		if (!supported.has(locale)) return;
		try {
			localStorage.setItem(key, locale);
		} catch {}
		store.set(locale);
	}
	function bind(node, message, { attr, values = {} } = {}) {
		const annotation = attr ? "data-sg-copy-" + attr : "data-sg-copy";
		if ((!attr || attrs.includes(attr)) && node.getAttribute(annotation) !== message)
			node.setAttribute(annotation, message);
		const slot = attr || "text",
			update = () => {
				const text = store.t(message, values);
				if (attr) node.setAttribute(attr, text);
				else node.textContent = text;
			};
		const slots = bindings.get(node) || new Map();
		slots.set(slot, update);
		bindings.set(node, slots);
		update();
		return () => {
			slots.delete(slot);
			if (!slots.size) bindings.delete(node);
		};
	}
	const attrs = ["aria-label", "aria-description", "placeholder", "title"];
	function bindAllAnnotated(scope = document) {
		const selector = ["[data-sg-copy]", ...attrs.map((a) => "[data-sg-copy-" + a + "]")].join(",");
		const nodes = [
			...(scope.matches?.(selector) ? [scope] : []),
			...scope.querySelectorAll(selector),
		];
		for (const node of nodes) {
			// An explicit state binding owns its slot. A later static scan only fills unbound slots.
			if (node.dataset.sgCopy && !bindings.get(node)?.has("text")) bind(node, node.dataset.sgCopy);
			for (const attr of attrs) {
				const message = node.getAttribute("data-sg-copy-" + attr);
				if (message && !bindings.get(node)?.has(attr)) bind(node, message, { attr });
			}
		}
	}
	window.SGGI18n = Object.freeze({
		...store,
		get locale() {
			return store.locale;
		},
		get missingKeys() {
			return store.missingKeys;
		},
		set,
		observe,
		bind,
		bindAllAnnotated,
	});
	store.subscribe(apply);
	window.addEventListener("storage", (e) => {
		if (e.key === key && supported.has(e.newValue)) store.set(e.newValue);
	});
	window.addEventListener("message", (e) => {
		if (
			e.origin !== location.origin ||
			e.source !== parent ||
			e.data?.channel !== "sgg:locale" ||
			!supported.has(e.data.locale)
		)
			return;
		store.set(e.data.locale);
	});
	document.addEventListener(
		"load",
		(e) => {
			if (e.target?.tagName === "IFRAME") notifyChildren();
		},
		true,
	);
	document.addEventListener(
		"DOMContentLoaded",
		() => {
			apply();
			bindAllAnnotated(document);
		},
		{ once: true },
	);
	apply();
})();

/* Shared primitives and semantic roles. Themes remain owned by theme-source.json. */
:root {

	--sg-invocation-wash: #e4f0fc;

	--sg-brand-secondary: #585e59;

	--sg-inline-avatar-size: 1em;

	--sg-inline-avatar-baseline: -0.14em;
	--sg-icon-action: 20px;
	--sg-icon-control: 18px;
	--sg-icon-chevron: 16px;
	--sg-icon-stroke: 1.65;
	--sg-type-brand: 1.125rem;
	--sg-type-brand-compact: 1.0625rem;
	--sg-weight-brand: 600;
	--sg-type-body: 1rem;
	--sg-type-description: var(--sg-type-body);
	--sg-type-title: 1.1875rem;
	--sg-type-app-navigation: 1.375rem;
	--sg-type-meta: 0.8125rem;
	--sg-type-context: 0.875rem;
	--sg-type-value: 1.125rem;
	--sg-type-amount: 1.25rem;
	--sg-type-compact: 0.9375rem;
	--sg-type-caption: 0.75rem;
	--sg-type-input: 1rem;
	--sg-type-number-input: 1.0625rem;
	--sg-type-metric: 3rem;
	--sg-text-body: var(--sg-type-body);
	--sg-text-author: 0.875rem;
	--sg-text-name: 1rem;
	--sg-text-meta: var(--sg-type-meta);
	--sg-text-help: 0.875rem;
	--sg-weight-name: 550;
	--sg-weight-value: 550;
	--sg-text-task-support: var(--sg-type-body);
	--sg-leading-copy: 1.75;
	--sg-leading-body: 1.75;
	--sg-leading-description: 1.75;
	--sg-leading-interface: 1.5;
	--sg-task-title-wide: 2.5rem;
	--sg-task-title: 2rem;
	--sg-task-title-leading: 1.35;
	--sg-space-related: 0.5rem;
	--sg-space-paragraph: 0.75rem;
	--sg-space-sibling: 1rem;
	--sg-space-section: 1.5rem;
	--sg-space-task: 2rem;
	--sg-space-surface: 1.5rem;
	--sg-radius-action: 10px;
	--sg-radius-control: 12px;
	--sg-radius-surface: 16px;
	--sg-radius-paper: 14px;
	--sg-radius-reading: 18px;
	--sg-radius-sheet: 22px;
	--sg-line-separator: color-mix(in srgb, var(--label, #1f2320) 10%, var(--surface, #fff));
	--sg-line-control: color-mix(in srgb, var(--label, #1f2320) 24%, var(--surface, #fff));
	--sg-line-paper: color-mix(in srgb, var(--label, #1f2320) 8%, var(--surface, #fff));
	--sg-shadow-paper:
		0 1px 2px color-mix(in srgb, var(--label, #1f2320) 4%, transparent),
		0 10px 24px -20px color-mix(in srgb, var(--label, #1f2320) 22%, transparent);
	--sg-shadow-popover:
		0 4px 12px -6px color-mix(in srgb, var(--label, #1f2320) 12%, transparent),
		0 12px 28px -12px color-mix(in srgb, var(--label, #1f2320) 16%, transparent);

	/* First-entry spatial explanation; ordinary App navigation keeps its shorter roles. */
	--sg-motion-gateway: 900ms;

	--sg-ease-gateway: cubic-bezier(0.77, 0, 0.175, 1);
	--sg-motion-app-open: 560ms;
	--sg-motion-app-close: 460ms;

/* Focus is functional state, not an edge frame. Pointer/autofocus stay quiet.
   The mark is inherited through embedded documents/shadow hosts and never changes layout. */
:root {
	--sg-focus-style: none;
}
:root[data-sg-focus-input="pointer"] {
	--sg-focus-mark-image: none;
	--sg-focus-mark-opacity: 0;
}
:root[data-sg-focus-input="keyboard"] {
	--sg-focus-mark-image: linear-gradient(currentColor, currentColor);
	--sg-focus-mark-opacity: 1;
}
:where(:focus) {
	outline: none;
}
:is(
	button,
	a,
	summary,
	select,
	[role="button"],
	[role="option"],
	[role="menuitem"],
	[role="menuitemradio"],
	[tabindex]:not([tabindex="-1"])
):not(input, textarea):focus-visible,
:is(.sg-choice, .option, .score-option, .star-option, .sg-switch):has(input:focus-visible)
	> :is(.option-label, .sg-switch-track, span) {
	/* Only this small navigation cue wins component background shorthand; fills remain untouched. */
	background-image: var(--sg-focus-mark-image, none) !important;
	background-size: var(--sg-space-sibling) 2px !important;
	background-position: center calc(100% - 4px) !important;
	background-repeat: no-repeat !important;
}
/* A forced system contrast palette is the explicit exception: preserve its native focus boundary. */
@media (forced-colors: active) {
	:root {
		--sg-focus-style: solid;
	}
	:focus-visible {
		outline: 2px solid Highlight;
		outline-offset: -2px;
	}
}

:root {
	--sg-button-ink:var(--ink);--sg-button-secondary:var(--secondary);--sg-button-surface:var(--surface,#fff);--sg-button-wash:var(--wash,color-mix(in srgb,var(--sg-button-ink) 12%,white));--sg-button-height:48px;--sg-button-compact:44px;--sg-button-radius:999px;--sg-button-ease:var(--sg-ease);--sg-button-press:var(--sg-motion-press);--sg-button-release:var(--sg-motion-release);--sg-button-state:var(--sg-motion-state);--sg-button-selection:var(--sg-motion-selection);--sg-button-selection-radius:var(--sg-radius-action)

	box-sizing: border-box;
	inline-size: calc(100% - var(--sg-safe-start) - var(--sg-safe-end));
	max-inline-size: var(--sg-frame);
	margin-inline: auto;
}
/* A scroll-owned App retains a reachable rail; task-specific short-canvas rules still win. */
.sg-inset-pane > :where(.sg-pane-toolbar) {
	position: sticky;
	inset-block-start: 0;
	z-index: 3;
	background-color: var(--canvas);
}
/* Progress group is mounted inside the common context line, before content. */
.sg-progress {
	display: inline-flex;
	align-items: center;
	flex-wrap: wrap;
	gap: var(--sg-related);
	flex: none;
	min-block-size: 0;
	margin: 0;
	padding: 0;
	font-size: var(--sg-type-meta);
	line-height: 1.5;
	color: var(--secondary, #535a55);
}
.sg-progress-group {
	display: inline-flex;
	flex-wrap: nowrap;
	align-items: baseline;
	gap: var(--sg-related);
	margin: 0;
	min-inline-size: 0;
	flex: none;
	font-size: inherit;
	line-height: inherit;
}
.sg-progress-name {
	margin: 0;
	font-size: inherit;
	font-weight: 550;
	line-height: inherit;
	color: var(--label, #1f2320);
}
.sg-progress-count {
	margin: 0;
	font-size: inherit;
	line-height: inherit;
	white-space: nowrap;
	color: var(--secondary, #535a55);
	font-variant-numeric: tabular-nums;
}
.sg-progress-actions {
	margin-inline-start: auto;
	display: flex;
	align-items: center;
	gap: var(--sg-related);
	min-inline-size: 0;
	flex: 0 1 auto;
	max-inline-size: 65%;
}

/* Content lanes express the task. They do not own the product header or progress. */
.sg-page {
	box-sizing: border-box;
	inline-size: calc(100% - var(--sg-safe-start) - var(--sg-safe-end));
	max-inline-size: var(--sg-frame);
	min-inline-size: 0;
	margin: var(--sg-page-top) auto 0;
	padding: 0 0 max(2rem, env(safe-area-inset-bottom));
	container-type: inline-size;
}
.sg-page[data-width="focus"] {
	max-inline-size: var(--sg-focus);
}
.sg-page[data-width="work"] {
	max-inline-size: var(--sg-work);
}
.sg-page[data-width="split"] {

}
/* Scroll-owned navigation overlays retain a full frame viewport. Reading

.sg-page.sg-navigation-scroll-canvas {
	--sg-page-content-width: var(--sg-work);
	max-inline-size: var(--sg-frame);
}
.sg-navigation-scroll-canvas[data-width="focus"] {
	--sg-page-content-width: var(--sg-focus);
}
.sg-navigation-scroll-canvas > :not(.sg-pane-toolbar) {
	inline-size: 100%;
	max-inline-size: var(--sg-page-content-width);
	margin-inline: auto;
}

body[data-scroll="workspace"] > .sg-page {
	flex: 1;
	min-block-size: 0;
	display: flex;
	flex-direction: column;
}

	display: block;

/* All navigable page bars use equal side tracks; the title stays optically centered. */
.sg-toolbar {
	position: relative;
	display: grid;
	grid-template-columns:
		minmax(var(--sg-nav-target, var(--sg-target)), 1fr) minmax(0, auto)
		minmax(var(--sg-nav-target, var(--sg-target)), 1fr);
	align-items: center;
	gap: var(--sg-related);
	flex: none;
	min-block-size: var(--sg-toolbar-height);
	block-size: auto;
	inline-size: 100%;
	margin: 0 0 var(--sg-page-gap);
	padding: 0;
	background: var(--canvas, var(--paper));
}
.sg-toolbar > .sg-toolbar-leading {
	grid-column: 1;
	grid-row: 1;
	justify-self: start;
	position: relative;
	inset: auto;
	margin: 0;
	max-inline-size: 100%;
}
.sg-toolbar > .sg-toolbar-title {
	grid-column: 2;
	grid-row: 1;
	justify-self: center;
	min-inline-size: 0;
	position: static;
	inset: auto;
	transform: none;
	margin: 0;
	text-align: center;
}
.sg-toolbar > .sg-toolbar-trailing {
	grid-column: 3;
	grid-row: 1;
	justify-self: end;
	position: relative;
	inset: auto;
	margin: 0;
	max-inline-size: 100%;
}
.sg-toolbar > .sg-toolbar-title,

.sg-toolbar[data-sticky] {

	inset-block-start: 0;

}
.sg-task-layout {

@container (max-width: 46rem) {

/* Workspace takes the remaining shell row, without subtracting an assumed header height. */
.sg-workspace {
	flex: 1;
	min-block-size: 0;
	block-size: auto;
	max-block-size: none;
}
body[data-layout-surface="rating"] .rating-app {
	block-size: auto;
	min-block-size: 0;
	max-block-size: none;
}

.sg-panel-toolbar {

	min-block-size: var(--sg-toolbar-height);

	line-height: 1.5;
	font-weight: 550;
}
@media (max-width: 760px) {

/* Game / round and phase / step share one context line (latest user decision). */
.sg-product-bar:has(> .sg-context-line) {

	grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr);
}
.sg-product-bar > .sg-context-line {
	justify-content: center;
	text-align: center;
}
.sg-product-bar > .sg-header-actions {
	justify-self: end;

.sg-product-bar > .game-context {

.sg-context-game {

}
.sg-toolbar > .sg-toolbar-leading {
	margin-inline: 0;
}
@media (max-width: 760px) {
	.sg-product-bar:has(> .sg-context-line) {
		grid-template-columns: minmax(0, 1fr) auto;
		gap: 0;
	}
	.sg-product-bar > .sg-context-line {
		grid-column: 1 / -1;
		grid-row: 2;
	}
	.sg-product-bar > .sg-header-actions {

	}

	}

	}

		font-size: var(--sg-type-context);
	}

	}

/* Semantic spacing: related < paragraph / siblings < sections < independent tasks. */

.decision-form {
	display: flex;
	flex-direction: column;
	gap: var(--sg-space-section);
}
.decision-form > .sg-field {
	margin-block: 0;
}
.decision-form > .consequence:empty {
	display: none;
}
.decision-form > .consequence.has-content {
	margin: 0;
}
.decision-form > .action-footer {
	margin-block-start: 0;
	gap: var(--sg-space-sibling);
}
@media (max-width: 760px) {
	.sg-task-layout {
		gap: var(--sg-space-section);
	}

/* TaskScene: the viewport is a canvas, with a reading band and a reachable action rail. */
body[data-task-scene] > .sg-page {
	flex: 1;
	display: flex;
	flex-direction: column;
	margin-block-start: 0;
	padding-block: var(--sg-space-task) max(var(--sg-space-section), env(safe-area-inset-bottom));
}
.sg-task-layout[data-scene]:where(:not(.sg-context-task)) {
	flex: 1;
	min-block-size: min-content;
	grid-template-rows: minmax(1.5rem, 0.8fr) auto minmax(2rem, 1fr) auto;
	grid-template-areas: ". ." "context interaction" ". ." ". actions";
	column-gap: var(--sg-task-gap);
	row-gap: var(--sg-space-task);
	align-items: start;
}

	padding: 0;

.sg-task-layout[data-scene]:where(:not(.sg-context-task))

.sg-task-layout[data-scene]:where(:not(.sg-context-task)) .decision-form > .sg-field {
	margin: 0;

@container (max-width: 46rem) {
	.sg-task-layout[data-scene]:where(:not(.sg-context-task)) {
		grid-template-columns: minmax(0, 1fr);
		grid-template-rows: minmax(1.5rem, 0.8fr) auto auto minmax(2rem, 1fr) auto;
		grid-template-areas: "." "context" "interaction" "." "actions";
		row-gap: var(--sg-space-section);
		align-items: start;
	}
	.sg-task-layout[data-scene]:where(:not(.sg-context-task)) > .intro {
		align-self: end;
	}
	.sg-task-layout[data-scene]:where(:not(.sg-context-task)) > .content {
		align-self: start;
	}
	.sg-task-layout[data-scene]:where(:not(.sg-context-task)) > .sg-scene-actions {
		align-self: end;
	}

/* Physical height shrinks naturally: min-content rows grow the document rather than clipping it. */
@media (max-height: 600px) {
	body[data-task-scene] > .sg-page {
		padding-block-start: var(--sg-space-section);
	}
	.sg-task-layout[data-scene]:where(:not(.sg-context-task)) {
		row-gap: var(--sg-space-sibling);
	}
}

/* Quiet states use one reading lane; empty columns do not determine their position. */
.sg-task-layout[data-scene="summary"] {
	grid-template-columns: minmax(0, 1fr);
	grid-template-rows: auto auto minmax(0, 1fr) auto;
	grid-template-areas: "context" "interaction" "." "actions";
	max-inline-size: var(--sg-task-reading-width);
	inline-size: 100%;
	margin-inline: auto;
	row-gap: var(--sg-space-section);
}

/* Gallery navigation shares the product frame; the visible glyph hangs on its reading guide. */
.sg-page-back.sg-button[data-sg-button] {
	position: absolute;
	--sg-nav-leading-overhang: calc(
		(var(--sg-button-compact) - var(--sg-icon-action)) /
		2 +
		var(--sg-icon-action) /
		3
	);
	inline-size: var(--sg-button-compact);
	block-size: var(--sg-button-compact);
	min-inline-size: var(--sg-button-compact);
	min-block-size: var(--sg-button-compact);
	inset-inline-start: calc(
		max(var(--sg-safe-start), (100% - var(--sg-frame)) / 2) -

	z-index: 160;

/* Short canvases trade elastic whitespace for content; type and hit areas keep their roles. */
@media (max-height: 600px) {
	body[data-task-scene] > .sg-page {
		min-block-size: 0;
		overflow: auto;

		grid-template-areas: "context interaction" ". actions";
		align-content: start;
		row-gap: var(--sg-space-sibling);
	}
	.sg-task-layout[data-scene="summary"] {
		grid-template-rows: auto auto auto;
		grid-template-areas: "context" "interaction" "actions";
		align-content: start;
		row-gap: var(--sg-space-sibling);
	}
	.sg-task-layout[data-scene]:where(:not(.sg-context-task)) > .content:empty {
		display: none;
	}
}
@media (max-height: 600px) {
	@container (max-width: 46rem) {
		.sg-task-layout[data-scene="decision"] {
			grid-template-rows: auto auto auto;
			grid-template-areas: "context" "interaction" "actions";
		}

/* Short workspaces first reclaim header and outer whitespace, keeping type and targets. */
@media (max-height: 500px) {
	:root {
		--sg-toolbar-height: var(--sg-target);
	}

/* A state host delivers the remaining canvas; the shared summary owns its inner rhythm once. */
.sg-state-page,
.sg-page.sg-state-page,
body[data-task-scene] > .sg-page.sg-state-page {
	flex: 1;
	display: flex;
	flex-direction: column;
	min-block-size: min-content;
	inline-size: calc(100% - var(--sg-safe-start) - var(--sg-safe-end));
	max-inline-size: var(--sg-work);
	margin: 0 auto;
	padding: 0;

/* Full-width App host. Its navigation and reading content own separate canvases. */

	inline-size: 100%;
	max-inline-size: none;
	padding-inline: 0;
	margin-inline: auto;

	inline-size: calc(
		100% -
		max(var(--sg-pane-inset), var(--sg-safe-start)) -
		max(var(--sg-pane-inset), var(--sg-safe-end))
	);
	margin-inline: auto;

	max-inline-size: var(--sg-work);
}
.sg-inset-pane > .sg-state-content {
	inline-size: calc(
		100% -
		max(var(--sg-pane-inset), var(--sg-safe-start)) -

			var(--sg-nav-target),

		);
	--sg-nav-target: var(--sg-button-compact);
	--sg-nav-leading-overhang: min(
		var(--sg-space-surface),
		calc((var(--sg-nav-target) - var(--sg-icon-action)) / 2 + var(--sg-icon-action) / 4)
	);
}
.sg-pane-toolbar > :is(h1, h2, .sg-toolbar-title),
.sg-pane-toolbar > :is(.sg-task-toolbar-label, .sg-toolbar-title) > :is(h1, h2) {
	font-size: var(--sg-type-app-navigation);
	line-height: var(--sg-leading-interface);
	font-weight: 600;
}
.sg-app-navigation-title {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	align-items: baseline;
	gap: 0 var(--sg-space-related);
	min-inline-size: 0;
}
.sg-app-name {

	overflow: hidden;
	text-overflow: ellipsis;

.sg-app-navigation-title > .app-readonly {

/* Focus is functional state, not an edge frame. Pointer/autofocus stay quiet.
   The mark is inherited through embedded documents/shadow hosts and never changes layout. */
:root {
	--sg-focus-style: none;

:root[data-sg-focus-input="pointer"] {
	--sg-focus-mark-image: none;
	--sg-focus-mark-opacity: 0;
}

	--sg-focus-mark-image: linear-gradient(currentColor, currentColor);
	--sg-focus-mark-opacity: 1;
}
:where(:focus) {
	outline: none;
}
:is(
	button,
	a,
	summary,
	select,
	[role="button"],
	[role="option"],
	[role="menuitem"],
	[role="menuitemradio"],
	[tabindex]:not([tabindex="-1"])
):not(input, textarea):focus-visible,
:is(.sg-choice, .option, .score-option, .star-option, .sg-switch):has(input:focus-visible)
	> :is(.option-label, .sg-switch-track, span) {
	/* Only this small navigation cue wins component background shorthand; fills remain untouched. */
	background-image: var(--sg-focus-mark-image, none) !important;
	background-size: var(--sg-space-sibling) 2px !important;
	background-position: center calc(100% - 4px) !important;
	background-repeat: no-repeat !important;

/* Shared primitives and semantic roles. Themes remain owned by theme-source.json. */
:root {
	--sg-invocation-ink: #0969c3;
	--sg-invocation-wash: #e4f0fc;
	--sg-brand-ink: #202321;
	--sg-brand-secondary: #585e59;
	--sg-brand-wash: #eeeeee;
	--sg-brand-canvas: #f5f6f4;
	--sg-font-ui:
		"SGG Paper UI", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial,
		"PingFang SC", "Microsoft YaHei", sans-serif;
	--sg-font-art: var(--sg-font-ui);
	--sg-font-logo: "SGG Paper Logo", var(--sg-font-ui);
	--sg-font-number: var(--sg-font-ui);
	--sg-inline-avatar-size: 1em;
	--sg-person-inline-gap: 0.16em;
	--sg-inline-avatar-baseline: -0.14em;
	--sg-icon-action: 20px;
	--sg-icon-control: 18px;
	--sg-icon-chevron: 16px;
	--sg-icon-stroke: 1.65;
	--sg-type-brand: 1.125rem;
	--sg-type-brand-compact: 1.0625rem;
	--sg-weight-brand: 600;
	--sg-type-body: 1rem;
	--sg-type-description: var(--sg-type-body);
	--sg-type-title: 1.1875rem;
	--sg-type-app-navigation: 1.375rem;
	--sg-type-meta: 0.8125rem;
	--sg-type-context: 0.875rem;
	--sg-type-value: 1.125rem;
	--sg-type-amount: 1.25rem;
	--sg-type-compact: 0.9375rem;
	--sg-type-caption: 0.75rem;
	--sg-type-input: 1rem;
	--sg-type-number-input: 1.0625rem;
	--sg-type-metric: 3rem;
	--sg-text-body: var(--sg-type-body);
	--sg-text-author: 0.875rem;
	--sg-text-name: 1rem;
	--sg-text-meta: var(--sg-type-meta);
	--sg-text-help: 0.875rem;
	--sg-weight-name: 550;
	--sg-weight-value: 550;
	--sg-text-task-support: var(--sg-type-body);
	--sg-leading-copy: 1.75;
	--sg-leading-body: 1.75;
	--sg-leading-description: 1.75;
	--sg-leading-interface: 1.5;
	--sg-task-title-wide: 2.5rem;
	--sg-task-title: 2rem;
	--sg-task-title-leading: 1.35;
	--sg-space-related: 0.5rem;
	--sg-space-paragraph: 0.75rem;
	--sg-space-sibling: 1rem;
	--sg-space-section: 1.5rem;
	--sg-space-task: 2rem;
	--sg-space-surface: 1.5rem;
	--sg-radius-action: 10px;
	--sg-radius-control: 12px;
	--sg-radius-surface: 16px;
	--sg-radius-paper: 14px;
	--sg-radius-reading: 18px;
	--sg-radius-sheet: 22px;
	--sg-line-separator: color-mix(in srgb, var(--label, #1f2320) 10%, var(--surface, #fff));
	--sg-line-control: color-mix(in srgb, var(--label, #1f2320) 24%, var(--surface, #fff));
	--sg-line-paper: color-mix(in srgb, var(--label, #1f2320) 8%, var(--surface, #fff));
	--sg-shadow-paper:
		0 1px 2px color-mix(in srgb, var(--label, #1f2320) 4%, transparent),
		0 10px 24px -20px color-mix(in srgb, var(--label, #1f2320) 22%, transparent);
	--sg-shadow-popover:
		0 4px 12px -6px color-mix(in srgb, var(--label, #1f2320) 12%, transparent),
		0 12px 28px -12px color-mix(in srgb, var(--label, #1f2320) 16%, transparent);
	--sg-shadow-dialog:
		0 6px 18px -10px color-mix(in srgb, var(--label, #1f2320) 10%, transparent),
		0 24px 64px -24px color-mix(in srgb, var(--label, #1f2320) 18%, transparent);
	--sg-backdrop: color-mix(in srgb, var(--label, #1f2320) 14%, transparent);
	/* First-entry spatial explanation; ordinary App navigation keeps its shorter roles. */
	--sg-motion-gateway: 900ms;
	--sg-motion-invitation: 800ms;
	--sg-motion-invitation-delay: 240ms;
	--sg-ease-gateway: cubic-bezier(0.77, 0, 0.175, 1);
	--sg-motion-app-open: 560ms;
	--sg-motion-app-close: 460ms;
	--sg-motion-expand: 200ms;
	--sg-motion-collapse: 160ms;
	--sg-motion-enter: 160ms;
	--sg-motion-exit: 120ms;
	--sg-motion-state: 140ms;
	--sg-motion-selection: 180ms;
	--sg-motion-press: 80ms;
	--sg-motion-release: 160ms;
	--sg-ease: cubic-bezier(0.23, 1, 0.32, 1);
}
body {
	font-family: var(--sg-font-ui);
	-webkit-font-smoothing: antialiased;
}
.sg-number-text {
	font-family: var(--sg-font-number);
	font-variant-numeric: lining-nums tabular-nums;
}
@media (max-width: 760px) {
	:root {
		--sg-task-title: 1.75rem;
		--sg-type-context: 0.8125rem;
		--sg-type-metric: 2.75rem;
		--sg-space-surface: 1.25rem;
	}
}
@media (max-width: 359px) {
	:root {
		--sg-space-surface: 1rem;
	}
}

/* Script-specific rhythm, shared semantic scale and native font metrics. */
:root:lang(en) {
	--sg-font-art: var(--sg-font-ui);
	--sg-leading-copy: 1.6;
	--sg-leading-body: 1.6;
	--sg-leading-description: 1.6;
}

/* Focus is functional state, not an edge frame. Pointer/autofocus stay quiet.
   The mark is inherited through embedded documents/shadow hosts and never changes layout. */
:root {
	--sg-focus-style: none;
}
:root[data-sg-focus-input="pointer"] {
	--sg-focus-mark-image: none;
	--sg-focus-mark-opacity: 0;
}
:root[data-sg-focus-input="keyboard"] {
	--sg-focus-mark-image: linear-gradient(currentColor, currentColor);
	--sg-focus-mark-opacity: 1;
}
:where(:focus) {
	outline: none;
}
:is(
	button,
	a,
	summary,
	select,
	[role="button"],
	[role="option"],
	[role="menuitem"],
	[role="menuitemradio"],
	[tabindex]:not([tabindex="-1"])
):not(input, textarea):focus-visible,
:is(.sg-choice, .option, .score-option, .star-option, .sg-switch):has(input:focus-visible)
	> :is(.option-label, .sg-switch-track, span) {
	/* Only this small navigation cue wins component background shorthand; fills remain untouched. */
	background-image: var(--sg-focus-mark-image, none) !important;
	background-size: var(--sg-space-sibling) 2px !important;
	background-position: center calc(100% - 4px) !important;
	background-repeat: no-repeat !important;
}
/* A forced system contrast palette is the explicit exception: preserve its native focus boundary. */
@media (forced-colors: active) {
	:root {
		--sg-focus-style: solid;
	}
	:focus-visible {
		outline: 2px solid Highlight;
		outline-offset: -2px;
	}
}

/* One identity heading for person, author and conversation context; the host owns padding/scrolling. */
.profile-identity {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	column-gap: var(--sg-space-paragraph);
	row-gap: var(--sg-space-related);
	min-inline-size: 0;
	margin-block-end: var(--sg-space-task);
}
.profile-identity > .sg-avatar {
	--avatar-size: var(--sg-person-heading-avatar, var(--avatar-profile));
	flex: none;
}
.profile-identity-copy {
	/* Reserve a readable identity before allowing the trailing action to share its row. */
	flex: 1 0 8ch;
	min-inline-size: 0;
	max-inline-size: calc(
		100% -
		var(--sg-person-heading-avatar, var(--avatar-profile)) -
		var(--sg-space-paragraph)
	);
}
.profile-identity-name {
	font: 600 var(--sg-type-title) / var(--sg-leading-interface) var(--sg-font-ui);
	white-space: nowrap;
	text-overflow: ellipsis;
	overflow: hidden;
	margin: 0;
}
.profile-identity > .sg-button {
	flex: none;
	margin-inline-start: auto;
}
.profile-identity .sg-action-stack {
	display: grid;
	flex: none;
	justify-items: center;
	max-inline-size: 100%;
	margin-inline-start: auto;
}
.profile-identity .sg-action-stack > button {
	justify-self: center;
}
.profile-identity .sg-action-stack > :is(.sg-action-hint, .action-helper) {
	justify-self: center;
	text-align: center;
	max-inline-size: 100%;
}
.profile-identity > .heading-meta {
	font: 400 var(--sg-type-meta) / var(--sg-leading-interface) var(--sg-font-ui);
	color: var(--secondary);
	min-inline-size: 0;
	max-inline-size: 100%;
	margin-inline-start: auto;
	text-align: end;
}
@media (max-width: 760px) {
	.profile-identity > .heading-meta {
		flex-basis: 100%;
	}
}

/* Profile geometry; typography consumes foundation/product-language roles, not descendant paragraph overrides. */
body {
	height: 100dvh;
	min-height: 0;
	background: var(--canvas);
	font-size: var(--sg-type-body);
}
body > .sg-page {
	margin-top: 0;
	min-height: 0;
	overflow: auto;
	padding-bottom: max(var(--sg-space-section), env(safe-area-inset-bottom));
}
[hidden] {
	display: none !important;
}
#profile-toolbar {
	position: sticky;
	top: 0;
	z-index: 2;
	background: var(--canvas);
}
#profile-list {
	background: var(--surface);
	border-radius: var(--sg-radius-surface);
	padding-inline: var(--sg-space-surface);
}
.profile-row {
	display: flex;
	align-items: center;
	gap: var(--sg-space-paragraph);
	width: 100%;
	min-height: 88px;
	padding: var(--sg-space-sibling) 0;
	border: 0;
	background: none;
	text-align: left;
	color: var(--label);
	font: inherit;
	cursor: pointer;
}
.profile-copy {
	flex: 1;
	min-width: 0;
}
.profile-copy strong {
	font-size: var(--sg-text-name);
	font-weight: var(--sg-weight-name);
	overflow-wrap: anywhere;
}
.profile-copy small {
	display: block;
	font-size: var(--sg-text-help);
	line-height: var(--sg-leading-copy);
	color: var(--secondary);
	margin-top: var(--sg-space-related);
	white-space: pre-line;
	overflow-wrap: anywhere;
}
.profile-row > svg {
	width: var(--sg-icon-chevron);
	height: var(--sg-icon-chevron);
	color: var(--secondary);
	flex: none;
	fill: none;
	stroke: currentColor;
	stroke-width: var(--sg-icon-stroke);
	stroke-linecap: round;
	stroke-linejoin: round;
}
.profile-row:focus-visible {
	outline: 2px var(--sg-focus-style, none) var(--ink);
	outline-offset: 3px;
	border-radius: 8px;
}
#profile-edit {
	display: grid;
	gap: var(--sg-space-section);
}
.profile-avatar {
	display: flex;
	justify-content: center;
	padding-top: var(--sg-space-section);
}
.profile-fields {
	padding: var(--sg-space-surface);
	border-radius: var(--sg-radius-surface);
	background: var(--surface);
	display: grid;
	gap: var(--sg-space-section);
}
.profile-fields label {
	display: grid;
	gap: var(--sg-space-related);
	font-size: var(--sg-text-help);
}
.profile-fields input,
.profile-fields textarea {
	font: inherit;
	font-size: var(--sg-type-input);
	line-height: var(--sg-leading-copy);
	width: 100%;
	padding: 10px 12px;
	color: var(--label);
	background: var(--sg-control-fill);
	border: 0;
	border-radius: var(--sg-control-radius);
}
.profile-fields textarea {
	resize: vertical;
	min-height: 120px;
}
.profile-fields :is(input, textarea):focus-visible {
	outline: 2px var(--sg-focus-style, none) var(--ink);
	outline-offset: 2px;
}
#profile-status {
	font-size: var(--sg-text-meta);
	line-height: var(--sg-leading-interface);
	color: var(--secondary);
	margin: 0;
	min-height: 21px;
}
#detail-body {
	display: grid;
	gap: var(--sg-space-section);
	padding-bottom: var(--sg-space-section);
	font: 400 var(--sg-type-body) / var(--sg-leading-body) var(--sg-font-ui);
}
#detail-body p {
	margin: 0;
	white-space: pre-wrap;
	overflow-wrap: anywhere;
}
.profile-filter {
	margin: 0 0 var(--sg-space-paragraph);
	display: flex;
	justify-content: flex-start;
}
.profile-empty {
	margin: 0;
	padding: var(--sg-space-section) 0;
	color: var(--secondary);
	font-size: var(--sg-text-help);
}
.profile-follow:empty {
	display: none;
}
.profile-follow {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: var(--sg-space-related);
}
.profile-error {
	width: 100%;
	font: 400 var(--sg-text-meta) / var(--sg-leading-interface) var(--sg-font-ui);
	color: var(--sg-control-danger);
	margin: 0;
}
.profile-relation,
.profile-activity-status,
.profile-activity-meta {
	font: 400 var(--sg-text-help) / var(--sg-leading-interface) var(--sg-font-ui);
	color: var(--secondary);
}
.profile-activity,
.profile-game-item,
.profile-activity-item {
	min-width: 0;
}

(() => {
	"use strict";
	const positive = (n) => Number.isSafeInteger(Number(n)) && Number(n) > 0;
	const apps = Object.freeze(
		Object.defineProperties(
			{},
			Object.fromEntries(
				["profile", "forum", "dm", "rating", "game", "questionnaire"].map((id) => [
					id,
					{ enumerable: true, get: () => SGGI18n.t("asset." + id) },
				]),
			),
		),
	);
	function quota(count) {
		return Number.isSafeInteger(count) && count >= 0
			? SGGI18n.t("asset.quota", { count })
			: SGGI18n.t("asset.quotaUnavailable");
	}
	function stamp({ round, step, steps } = {}) {
		const parts = [];
		if (positive(round)) parts.push(SGGI18n.t("asset.roundStamp", { round }));
		if (positive(step))
			parts.push(
				positive(steps) && Number(step) <= Number(steps)
					? SGGI18n.t("asset.socialStamp", { step, steps })
					: SGGI18n.t("asset.socialStep", { step }),
			);
		return parts.join(" · ");
	}
	function identities(context) {
		return Object.fromEntries(
			(context?.people || []).map((p) => [
				p.id,
				{ name: p.name, avatar: context.profiles?.[p.id]?.avatar || "default" },
			]),
		);
	}
	window.SGGProductLanguage = Object.freeze({ apps, quota, stamp, identities });
})();
